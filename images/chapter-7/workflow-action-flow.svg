<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#6E6E80"/>
    </marker>
  </defs>

  <!-- clockwise curved arrows along the ring (radius 300, center 600,490) -->
  <g fill="none" stroke="#6E6E80" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M731.5,220.4 A300,300 0 0 1 869.6,358.5"/>
    <path d="M869.6,621.5 A300,300 0 0 1 731.5,759.6"/>
    <path d="M468.5,759.6 A300,300 0 0 1 330.4,621.5"/>
    <path d="M330.4,358.5 A300,300 0 0 1 468.5,220.4"/>
  </g>

  <!-- nodes -->
  <g filter="url(#shadow)">
    <circle cx="600" cy="190" r="115" fill="#E8E8F4" stroke="#6A6AB0" stroke-width="4"/>
    <circle cx="900" cy="490" r="115" fill="#F7EFE0" stroke="#B08A40" stroke-width="4"/>
    <circle cx="600" cy="790" r="115" fill="#EDF7E8" stroke="#7AA85A" stroke-width="4"/>
    <circle cx="300" cy="490" r="115" fill="#F7E8F2" stroke="#A85A94" stroke-width="4"/>
  </g>

  <g font-size="30" font-weight="700" text-anchor="middle">
    <text x="600" y="200" fill="#1A1A4A">Transaction</text>
    <text x="900" y="500" fill="#4A3810">Store</text>
    <text x="600" y="800" fill="#2A4A10">Serve</text>
    <text x="300" y="500" fill="#4A1038">AI Action</text>
  </g>
</svg>
