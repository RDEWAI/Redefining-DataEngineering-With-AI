<text x="78" y="830" font-size="17" font-weight="700" fill="#3A1A5A">Constraints</text>
<text x="78" y="860" font-size="14.5" fill="#3A1A5A">•  PrescriptionMedication  and  OTCMedication  are subclasses of  Medication   (is-a)</text>
<text x="78" y="887" font-size="14.5" fill="#3A1A5A">•  Patient  must have  ≥ 1  Encounter</text>
<text x="78" y="914" font-size="14.5" fill="#3A1A5A">•  Encounter  belongsTo  exactly 1  Patient   and   conductedBy  exactly 1  Provider</text>
<text x="78" y="941" font-size="14.5" fill="#3A1A5A">•  prescribes  →  range only  Medication</text>
<text x="78" y="968" font-size="14.5" fill="#3A1A5A">•  Unique keys:  patientId, providerId, encounterId, code</text>
