skill: create-stm
version: "1.0"
cases:
  - id: TC-001
    name: "Complete inputs produce valid STM"
    description: "Given DMS and HLD, skill produces an STM workbook that passes validation"
    inputs:
      folder: "inputs/stm/v1"
      upstream: "outputs/dms/v1"
    expected:
      - type: validation_pass
      - type: sheet_present
        sheets:
          - "Summary"
          - "Source-to-Bronze"
          - "Bronze-to-Silver"
          - "Silver-to-Gold"
          - "Code Systems"
          - "Null Handling"
          - "Edge Cases"
          - "Lineage"
    success_criteria: "All 8 sheets present and workbook passes validation"

  - id: TC-002
    name: "Output is xlsx not markdown"
    description: "STM output must be an Excel workbook, not markdown"
    inputs:
      folder: "inputs/stm/v1"
      upstream: "outputs/dms/v1"
    expected:
      - type: file_extension
        extension: ".xlsx"
    success_criteria: "Output file has .xlsx extension"

  - id: TC-003
    name: "Database unavailable blocks generation"
    description: "When database path is invalid, skill must STOP"
    inputs:
      folder: "inputs/stm/v1"
      override_db_path: "/nonexistent/path.db"
    expected:
      - type: asks_question
        about: "database"
      - type: no_output_generated
    success_criteria: "Skill does not generate STM"

  - id: TC-004
    name: "Column-level transformations are SQL expressions"
    description: "Transformation column must contain SQL, not English prose"
    inputs:
      folder: "inputs/stm/v1"
      upstream: "outputs/dms/v1"
    expected:
      - type: no_vague_language
        banned: ["clean the", "fix the", "process the"]
    success_criteria: "All transformations are concrete SQL expressions"

  - id: TC-005
    name: "DMS traceability in mappings"
    description: "Mapping rows reference DMS section numbers"
    inputs:
      folder: "inputs/stm/v1"
      upstream: "outputs/dms/v1"
    expected:
      - type: content_contains
        patterns: ["dms_ref"]
    success_criteria: "DMS references found in mapping sheets"

  - id: TC-006
    name: "Lineage sheet traces gold to source"
    description: "Lineage sheet must have complete column-level lineage"
    inputs:
      folder: "inputs/stm/v1"
      upstream: "outputs/dms/v1"
    expected:
      - type: content_contains
        patterns: ["gold_table", "source_column", "transformation_chain"]
    success_criteria: "End-to-end lineage documented"
