skill: validate-stm
version: "1.0"
cases:
  - id: TC-001
    name: "Valid STM passes validation"
    description: "A complete STM workbook with all 8 sheets passes validation"
    inputs:
      file: "test_fixtures/valid_stm.xlsx"
    expected:
      - type: validation_pass
      - type: exit_code
        code: 0
    success_criteria: "Validator returns exit code 0, no CRITICAL issues"

  - id: TC-002
    name: "Missing sheets caught as CRITICAL"
    description: "STM missing required sheets triggers CRITICAL findings"
    inputs:
      file: "test_fixtures/minimal_invalid_stm.xlsx"
    expected:
      - type: validation_fail
        severity: CRITICAL
      - type: exit_code
        code: 1
    success_criteria: "Missing sheets reported as CRITICAL"

  - id: TC-003
    name: "Missing column headers caught"
    description: "Sheets with wrong or missing standard columns trigger WARNING"
    inputs:
      file: "test_fixtures/bad_headers_stm.xlsx"
    expected:
      - type: validation_fail
        severity: WARNING
    success_criteria: "Missing standard columns reported as WARNING"
