# decision; clinical_patients feeds the Clinical Dashboard 1-hour SLA
# [DRD §4.4]).
table: clinical_patients
layer: silver
dq_rules_path: ../../dq_rules/clinical_patients.yml

# Severity thresholds for reconciliation tasks (LLD §5.5).
thresholds:
