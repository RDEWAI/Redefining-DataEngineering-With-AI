product_id: patient-360
dq_env:
  DEV:
    table_name: unity.silver.clinical_medications
    action_if_failed: ignore
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 0
    priority: medium
  QA:
    table_name: unity.silver.clinical_medications
    action_if_failed: ignore
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5
    priority: medium
  PROD:
    table_name: unity.silver.clinical_medications
    action_if_failed: fail
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    priority: high
rules:
- rule: DQ_FLD_071
  rule_type: row_dq
  column_name: patient_id
  expectation: patient_id IS NOT NULL
  action_if_failed: fail
  tag: field_validation
  description: NOT NULL on patient_id
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: high
- rule: DQ_FLD_072
  rule_type: row_dq
  column_name: encounter_id
  expectation: encounter_id IS NOT NULL
  action_if_failed: fail
  tag: field_validation
  description: NOT NULL on encounter_id
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: high
- rule: DQ_FLD_073
  rule_type: row_dq
  column_name: rxnorm_code
  expectation: rxnorm_code IS NOT NULL
  action_if_failed: ignore
  tag: field_validation
  description: NOT NULL on rxnorm_code
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: medium
- rule: DQ_FLD_074
  rule_type: row_dq
  column_name: medication_status
  expectation: medication_status IN ('Active', 'Discontinued')
  action_if_failed: ignore
  tag: field_validation
  description: ENUM on medication_status
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: medium
- rule: DQ_FLD_075
  rule_type: row_dq
  column_name: base_cost
  expectation: base_cost IS NOT NULL
  action_if_failed: ignore
  tag: field_validation
  description: NOT NULL on base_cost
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: medium
- rule: DQ_FLD_076
  rule_type: row_dq
  column_name: total_cost
  expectation: total_cost IS NOT NULL
  action_if_failed: ignore
  tag: field_validation
  description: NOT NULL on total_cost
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: medium
- rule: DQ_REF_006
  rule_type: query_dq
  column_name: ''
  expectation: (SELECT COUNT(*) FROM clinical_medications_view c LEFT JOIN clinical_patients p ON c.patient_id = p.patient_id WHERE p.patient_id IS NULL) = 0
  action_if_failed: ignore
  tag: referential_integrity
  description: 'FK check: clinical_medications.patient_id -> clinical_patients.patient_id'
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: true
  priority: high
- rule: DQ_REF_007
  rule_type: query_dq
  column_name: ''
  expectation: (SELECT COUNT(*) FROM clinical_medications_view c LEFT JOIN clinical_encounters p ON c.encounter_id = p.encounter_id WHERE p.encounter_id IS NULL) = 0
  action_if_failed: ignore
  tag: referential_integrity
  description: 'FK check: clinical_medications.encounter_id -> clinical_encounters.encounter_id'
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: true
  priority: high
- rule: DQ_STA_025
  rule_type: agg_dq
  column_name: ''
  expectation: count(*) > 0
  action_if_failed: ignore
  tag: statistical_distribution
  description: 'Statistical check: stop_date baseline=5.2%'
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: true
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: medium
