    s, (SELECT COUNT(*) AS cnt FROM unity.analytics.patient_summary) t
  action_if_failed: fail
  tag: reconciliation
  description: 'Reconciliation: unity.clinical.clinical_patients (is_current=TRUE)
    vs unity.analytics.patient_summary (COUNT(*)), tolerance=+/-0.1%'
  enable_for_source_dq_validation: true
  enable_for_target_dq_validation: true
  is_active: false
  enable_error_drop_alert: true
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: true
  priority: high
