product_id: patient-360
dq_env:
  DEV:
    table_name: unity.silver.billing_claims
    action_if_failed: ignore
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 0
    priority: medium
  QA:
    table_name: unity.silver.billing_claims
    action_if_failed: ignore
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5
    priority: medium
  PROD:
    table_name: unity.silver.billing_claims
    action_if_failed: fail
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    priority: high
rules:
- rule: DQ_FLD_093
  rule_type: row_dq
  column_name: claim_id
  expectation: claim_id IS NOT NULL
  action_if_failed: fail
  tag: field_validation
  description: NOT NULL on claim_id
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: high
- rule: DQ_FLD_094
  rule_type: row_dq
  column_name: patient_id
  expectation: patient_id IS NOT NULL
  action_if_failed: fail
  tag: field_validation
  description: NOT NULL on patient_id
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: high
- rule: DQ_REF_017
  rule_type: query_dq
  column_name: ''
  expectation: (SELECT COUNT(*) FROM billing_claims_view c LEFT JOIN clinical_patients p ON c.patient_id = p.patient_id WHERE p.patient_id IS NULL) = 0
  action_if_failed: ignore
  tag: referential_integrity
  description: 'FK check: billing_claims.patient_id -> clinical_patients.patient_id'
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: true
  priority: high
