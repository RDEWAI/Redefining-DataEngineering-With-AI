[project]
name = "patient_360"
version = "0.1.0"
description = "chapter-7 — Patient 360 medallion pipeline"
authors = [{ name = "Data Engineer" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2",
    "litellm>=1.50",
    "pyspark[pipelines]==4.1.1",
    "delta-spark==4.3.0",
    "spark-expectations>=2.10.0",
    "duckdb>=1.5.2",
]

[project.optional-dependencies]
dev = [
    "apache-airflow==3.2.1",
    "apache-airflow-providers-apache-spark==6.0.1",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.11",
]

[project.scripts]
# First-class CLI entry points (installed on the PATH by `uv sync`):
#   cost-triage --fixture           # run the Cost Anomaly Triage workflow
#   knowledge-ai-search ask "..."   # NL question over knowledge + Gold
cost-triage = "ai_workflows.cost_triage:main"
knowledge-ai-search = "patient_360.knowledge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_360", "ai_workflows"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring Spark/UC/Docker (run via `make integration-test`)",
    "local_spark: self-contained local-Spark integration smoke; needs no live Airflow/UC/Marquez stack",
    "benchmark: performance benchmark tests (LLD §6 perf tuning; opt-in via `pytest -m benchmark`)",
]
