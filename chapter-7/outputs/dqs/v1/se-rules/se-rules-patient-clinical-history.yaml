  # --- Statistical Distribution (agg_dq) ---
  - rule: DQ-STA-018
    rule_type: agg_dq
    column_name: ""
    expectation: "count(*) > 333721 and count(*) < 347343"
    action_if_failed: fail
    tag: statistical_distribution
    description: "Row count within +/-2% of baseline (340,532) -- patient-critical"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

  # --- Referential Integrity (query_dq) ---
  - rule: DQ-REF-019
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM analytics.patient_clinical_history h
            LEFT JOIN analytics.patient_summary s ON h.patient_id = s.patient_id
            WHERE s.patient_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Clinical history must have matching patient_summary -- Reject + Quarantine"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  # --- Reconciliation (query_dq) ---
  - rule: DQ-REC-005
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN ABS(s.cnt - t.cnt) * 100.0 / NULLIF(s.cnt, 0) <= 0.1
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS cnt FROM synthea.encounters) s,
           (SELECT COUNT(*) AS cnt FROM analytics.patient_clinical_history) t
    action_if_failed: fail
    tag: reconciliation
    description: "Source-to-Gold encounter count -- +/-0.1% tolerance [SLA SS3]"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  # --- Freshness (query_dq) ---
  - rule: DQ-FRS-002
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - MAX(_ingested_at))) / 3600 <= 1
      THEN 1 ELSE 0 END
      FROM analytics.patient_clinical_history
    action_if_failed: fail
    tag: freshness
    description: "Clinical Dashboard SLA -- clinical history must be refreshed within 1 hour [DRD SS4.4]"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
