    rule_type: row_dq
    column_name: patient_id
    expectation: "patient_id IS NOT NULL"
    action_if_failed: fail
    tag: field_validation
    description: "Encounter patient FK must not be null [STM DQ-007]"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

  - rule: DQ-FLD-062
    rule_type: row_dq
    column_name: encounter_class
    expectation: "encounter_class IS NULL OR encounter_class IN ('AMBULATORY','INPATIENT','EMERGENCY','OUTPATIENT','WELLNESS','URGENTCARE','HOME','HOSPICE','SNF','VIRTUAL','UNMAPPED')"
    action_if_failed: drop
    tag: field_validation
    description: "Encounter class must be valid SNOMED-CT enum or null [STM Code Systems]"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  - rule: DQ-FLD-063
    rule_type: row_dq
    column_name: start_date
    expectation: "CAST(start_date AS DATE) >= '1900-01-01' AND CAST(start_date AS DATE) <= CURRENT_DATE"
    action_if_failed: fail
    tag: field_validation
    description: "Encounter start date must be between 1900-01-01 and today [DRD SS3.2]"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

