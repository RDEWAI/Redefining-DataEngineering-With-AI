  # --- Referential Integrity (query_dq) ---
  - rule: DQ-REF-001
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_encounters e
            LEFT JOIN clinical.clinical_patients p ON e.patient_id = p.patient_id
            WHERE p.patient_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Encounters must have matching patient -- Reject + Quarantine orphans"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  - rule: DQ-REF-002
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_encounters e
            LEFT JOIN reference.reference_organizations o ON e.organization_id = o.organization_id
            WHERE e.organization_id IS NOT NULL AND o.organization_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Encounters must have matching organization -- Reject + Quarantine orphans"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  - rule: DQ-REF-003
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_encounters e
            LEFT JOIN reference.reference_providers p ON e.provider_id = p.provider_id
            WHERE e.provider_id IS NOT NULL AND p.provider_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Encounters must have matching provider -- Reject + Quarantine orphans"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

