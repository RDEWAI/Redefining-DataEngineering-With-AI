skill: validate-lld
version: "1.0"
cases:
  - id: TC-001
    name: "Valid LLD passes validation"
    description: "A complete LLD with all 14 sections and proper metadata should pass"
    inputs:
      lld_path: "outputs/lld/v1/LLD-2026-03-22-patient-360.md"
    expected:
      - type: validation_pass
        description: "0 CRITICAL issues reported"
    success_criteria: "Validator reports no critical issues"

  - id: TC-002
    name: "Missing sections produce CRITICAL"
    description: "An LLD missing required sections must report CRITICAL errors"
    inputs:
      lld_content: "# LLD: Test\n\n## 1. Design Overview\n\nSome content."
    expected:
      - type: validation_fail
        description: "CRITICAL issues for missing sections"
    success_criteria: "Validator identifies all missing required sections"

  - id: TC-003
    name: "Empty sections produce CRITICAL"
    description: "An LLD with empty required sections must report CRITICAL errors"
    inputs:
      lld_content: "Full LLD with empty section bodies"
    expected:
      - type: validation_fail
        description: "CRITICAL issues for empty sections"
    success_criteria: "Validator flags sections with no meaningful content"

  - id: TC-004
    name: "Missing upstream references produce CRITICAL"
    description: "Section 11 must reference all 5 upstream artifacts"
    inputs:
      lld_content: "LLD with Section 11 missing DMS reference"
    expected:
      - type: validation_fail
        description: "CRITICAL for missing upstream artifact reference"
    success_criteria: "Validator flags missing upstream artifact references"

  - id: TC-005
    name: "Missing companion files produce INFO"
    description: "When dag-definition.yaml, dag-pipeline.mmd, or impl-sequence.md are absent, INFO is reported"
    inputs:
      lld_path: "outputs/lld/v1/LLD-2026-03-22-patient-360.md"
      remove_files: ["dag/dag-definition.yaml", "dag/dag-pipeline.mmd", "impl-sequence.md"]
    expected:
      - type: content_contains
        patterns: ["dag-definition.yaml", "dag-pipeline.mmd", "impl-sequence.md"]
    success_criteria: "Validator reports INFO for missing derived artifacts"

  - id: TC-006
    name: "Missing local_executor_mode in §6 produces CRITICAL"
    description: "§6 must declare `local_executor_mode` in a fenced YAML block (Decision C)"
    inputs:
      lld_content: "LLD with §6 prose only — no fenced YAML, no executor mode declaration"
    expected:
      - type: validation_fail
        description: "CRITICAL for missing local_executor_mode"
      - type: content_contains
        patterns: ["local_executor_mode", "in-airflow-local"]
    success_criteria: "Validator flags missing executor-mode declaration; suggests one of three valid modes"

  - id: TC-007
    name: "Path-based Bronze write in §2 produces CRITICAL"
    description: "Bronze runner contracts must use UCSingleCatalog + saveAsTable, not warehouse paths (Decision 15)"
    inputs:
      lld_content: "LLD with §2.3 stating Bronze output = `warehouse/{env}/bronze/<table>/ds={ds}/`"
    expected:
      - type: validation_fail
        description: "CRITICAL for path-based Bronze write"
      - type: content_contains
        patterns: ["Decision 15", "saveAsTable", "UCSingleCatalog"]
    success_criteria: "Validator rejects path-based Bronze writes; cites Decision 15"

  - id: TC-008
    name: "spark-expectations pin below 2.10 produces CRITICAL"
    description: "Earlier 2.x releases lack the YAML rule loader and break generated se_runner.py"
    inputs:
      lld_content: "LLD §11 references `spark-expectations==2.6.0`"
    expected:
      - type: validation_fail
        description: "CRITICAL for SE pin below 2.10"
      - type: content_contains
        patterns: ["2.10", "YAML rule loader"]
    success_criteria: "Validator rejects SE 2.x pins below 2.10; suggests >=2.10.0"

  - id: TC-009
    name: "Missing §6 subsections (6.1–6.5) produce WARNING"
    description: "Downstream rules cite §6.1 / §6.2 / §6.3 / §6.4 / §6.5 by number"
    inputs:
      lld_content: "LLD with §6 as one paragraph, no subsections"
    expected:
      - type: content_contains
        patterns: ["6.1", "6.2", "6.3", "6.4", "6.5"]
    success_criteria: "Validator suggests subsection structure"

  - id: TC-010
    name: "Missing UC catalog config in §7 produces WARNING"
    description: "Bronze runner consumes `catalog_uc_uri` / `catalog_bronze_catalog_name` / `catalog_bronze_schema`"
    inputs:
      lld_content: "LLD §7 missing the UC catalog parameter rows"
    expected:
      - type: content_contains
        patterns: ["catalog_uc_uri", "catalog_bronze_catalog_name", "catalog_bronze_schema"]
    success_criteria: "Validator suggests adding UC catalog config rows"

  - id: TC-011
    name: "UC-wired Bronze without §13 Decision 15 produces INFO"
    description: "Surface the policy decision so future maintainers don't drift back to path-based"
    inputs:
      lld_content: "LLD §2 references UCSingleCatalog but §13 Decision Log has no Decision 15 entry"
    expected:
      - type: content_contains
        patterns: ["Decision 15", "UCSingleCatalog"]
    success_criteria: "Validator prompts the user to record the decision"
