# Curated overlay consumed by /developer-plugin:refresh-libraries when
# rewriting LIBRARIES.md. The keys here are matched against `Library`
# rows in LIBRARIES.md (case-insensitive substring match — same logic
# refresh_libraries.py uses for PyPI/GitHub resolution).
#
# Why this file exists: PyPI metadata gives us versions but not canonical
# import paths. When SE renamed `WrappedDataFrameWriter`'s home or removed
# `spark_expectations.rules`, generators that hardcoded the imports drifted
# silently. This overlay is the single human-curated source of truth for
# "the imports our code generators emit".
#
# Schema per library:
#   min_version       — string. If the resolved version is below this,
#                       refresh-libraries flags a CRITICAL drift.
#   canonical_imports — list[str]. Verbatim Python import lines.
#   spark_jars_packages — list[str]. Optional; for libs with a JAR coordinate.
#   notes             — string. Free-form context (changelog pointer, etc.).

spark-expectations:
  min_version: "2.10.0"
  canonical_imports:
    - "from spark_expectations.core.expectations import SparkExpectations, WrappedDataFrameWriter"
    - "from spark_expectations.config.user_config import Constants as user_config"
    - "from spark_expectations.rules import load_rules_from_yaml"
  notes: >-
    The `spark_expectations.rules` package and `WrappedDataFrameWriter`
    were added in v2.10.0
    (https://github.com/Nike-Inc/spark-expectations/releases/tag/v2.10.0).
    Earlier 2.x releases (e.g. 2.6.0) raise `ModuleNotFoundError` on these
    imports and silently bypass DQ via `BRONZE_SKIP_SE=1` — explicitly
    forbidden in chapter-5.

pyspark:
  min_version: "4.1.0"
  canonical_imports:
    - "from pyspark.sql import SparkSession, DataFrame"
    - "from pyspark.sql import functions as F"
    - "from pyspark.sql.functions import col, lit, current_timestamp"
  notes: >-
    Spark 4.1 line (pinned 4.1.1). PyPI publishes 4.1.x wheels for
    Python 3.10–3.13. Required by the UC 0.5.0 Spark connector, whose
    Maven coordinate carries a `_4.1` Spark-version infix (see
    unitycatalog below) — connector, delta-spark, and pyspark must all
    be on the same Spark major.minor.

delta-spark:
  min_version: "4.1.0"
  canonical_imports:
    - "from delta.tables import DeltaTable"
  spark_jars_packages:
    - "io.delta:delta-spark_2.13:4.3.0"
  notes: >-
    delta-spark 4.3.0 targets the Spark 4.1 ABI (Scala 2.13). The
    `catalogManaged` table feature + coordinated commits used by the
    re-enabled spark-expectations error/stats tables require
    delta-spark 4.1+ AND a commit-coordinating UC server (0.5.0+).

apache-airflow-providers-apache-spark:
  min_version: "6.0.1"
  canonical_imports:
    - "from airflow.providers.apache.spark.operators.spark_submit import SparkSubmitOperator"
  notes: "Targets Airflow 3.x; pairs with the in-airflow PySpark 4.1.1 install."

apache-airflow:
  min_version: "3.2.1"
  canonical_imports:
    - "from airflow.decorators import dag, task, task_group"
    - "from airflow.models import Variable"
  notes: "Airflow 3.x is current stable; 2.x is maintenance-only."

unitycatalog:
  min_version: "0.5.0"
  spark_jars_packages:
    - "io.unitycatalog:unitycatalog-spark_4.1_2.13:0.5.0"
  notes: >-
    NEW coordinate shape in 0.5.0: the connector artifact name carries a
    `_4.1` Spark-version infix — `unitycatalog-spark_4.1_2.13` — not the
    old `unitycatalog-spark_2.13`. The artifact name encodes the Spark
    major.minor, so it is coupled to pyspark/delta-spark (all on 4.1).
    Server image: unitycatalog/unitycatalog:v0.5.0 — no released server
    Docker image, so build-from-source once and push to our own registry
    (same pattern as the UC UI `uc-ui-source` build). 0.5.0 fixes the
    empty-namespace ArrayIndexOutOfBoundsException in
    UCSingleCatalog.fullTableNameForApi that crashed the 0.4.0
    spark-expectations error table, and adds `catalogManaged` tables +
    coordinated commits (requires a schema managed location / storage_root
    and a server↔Spark shared `_delta_log`).

openlineage:
  min_version: "1.50.0"
  spark_jars_packages:
    - "io.openlineage:openlineage-spark_2.13:1.50.0"
  notes: >-
    Bumped 1.46.0 → 1.50.0 alongside the Spark 4.1 upgrade. The
    listener coordinate keeps the plain `_2.13` Scala suffix (no Spark
    infix). Verify the listener boots clean against Spark 4.1 during the
    live deploy.
