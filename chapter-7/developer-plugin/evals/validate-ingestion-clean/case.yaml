schema_version: "1.1"
name: validate-ingestion-clean
tags: [validator]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: "This session is non-interactive and AskUserQuestion is unavailable. Where a skill says to clarify with the user, take the value stated in the LLD or the skill's documented default and continue without asking. Note: the uv binary panics inside this sandbox, so wherever a skill says `uv run python`, run `.venv/bin/python` from the workspace root instead (the fixture venv already has every workspace dependency). Do not try to install packages; there is no network."
