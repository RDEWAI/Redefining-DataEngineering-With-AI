# SE Rules for analytics.dim_patient
# Generated from: DQS-2026-03-17-patient-360.md
# Compatible with spark-expectations >= 2.6.0
# Load with: load_rules_from_yaml(this_file, spark, options={"dq_env": "PROD"})
# Product: patient-360
# Rules: 5

product_id: patient-360

dq_env:
  DEV:
    table_name: "dev_analytics.dim_patient"
    action_if_failed: ignore         # permissive — log but don't block
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 0          # integer % — alert on any drop
    priority: medium
  QA:
    table_name: "qa_analytics.dim_patient"
    action_if_failed: ignore         # NOT drop — drop only valid for row_dq
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5          # integer % — alert if >5% dropped
    priority: medium
  PROD:
    table_name: "analytics.dim_patient"
    action_if_failed: fail           # strictest — halt pipeline on failures
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2          # integer % — alert if >2% dropped
    priority: high

rules:
  - rule: DQ-FLD-010
    rule_type: row_dq
    column_name: patient_sk
    expectation: patient_sk IS NOT NULL
    action_if_failed: fail
    tag: field_validation
    description: Surrogate key must never be null
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

  - rule: DQ-FLD-011
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN
        (SELECT COUNT(*) FROM analytics.dim_patient WHERE is_current = true)
        = (SELECT COUNT(DISTINCT patient_id) FROM analytics.dim_patient
           WHERE is_current = true)
      THEN 1 ELSE 0 END
    action_if_failed: fail
    tag: field_validation
    description: Current patient_id must be unique (one active SCD2 row per patient)
    enable_for_source_dq_validation: true   # query_dq: check both source and target
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  - rule: DQ-STA-005
    rule_type: agg_dq
    column_name: ""
    expectation: "count(*) > 900 and count(*) < 1100"
    action_if_failed: ignore
    tag: statistical_distribution
    description: >
      Current patient count within ±10% of baseline (1000).
      Note: WHERE is_current = true filter must be applied upstream before SE runs.
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 10
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  - rule: DQ-REC-001
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN ABS(s.cnt - t.cnt) * 100.0 / NULLIF(s.cnt, 0) <= 0.1
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(DISTINCT id) AS cnt FROM synthea.patients) s,
           (SELECT COUNT(DISTINCT patient_id) AS cnt
            FROM analytics.dim_patient WHERE is_current = true) t
    action_if_failed: fail
    tag: reconciliation
    description: >
      Patient count reconciliation: source bronze.patients vs
      analytics.dim_patient (is_current=true), tolerance ±0.1%
    enable_for_source_dq_validation: true   # query_dq: check both source and target
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  - rule: DQ-FLD-015
    rule_type: row_dq
    column_name: effective_from
    expectation: effective_from IS NOT NULL
    action_if_failed: fail
    tag: field_validation
    description: SCD2 effective_from date must be populated for all rows
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high
