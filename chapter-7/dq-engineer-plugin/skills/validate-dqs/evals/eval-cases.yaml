skill: validate-dqs
version: "1.0"
cases:
  - id: TC-001
    name: "Valid DQS passes validation"
    description: "A complete, well-formed DQS passes with 0 CRITICAL issues"
    inputs:
      file: "test_fixtures/valid_dqs.md"
    expected:
      - type: validation_pass
      - type: exit_code
        code: 0
    success_criteria: "Validator returns exit code 0, no CRITICAL issues"

  - id: TC-002
    name: "Missing sections caught as CRITICAL"
    description: "DQS missing required sections triggers CRITICAL findings"
    inputs:
      file: "test_fixtures/minimal_invalid_dqs.md"
    expected:
      - type: validation_fail
        severity: CRITICAL
      - type: exit_code
        code: 1
    success_criteria: "Missing sections reported as CRITICAL"

  - id: TC-003
    name: "Missing rule IDs caught as WARNING"
    description: "Rules without proper DQ-{layer}-{table}-{NNN} IDs trigger WARNING"
    inputs:
      file: "test_fixtures/bad_rule_ids_dqs.md"
    expected:
      - type: validation_fail
        severity: WARNING
    success_criteria: "Malformed rule IDs reported as WARNING"

  - id: TC-004
    name: "Missing alert framework caught"
    description: "DQS without alert/escalation section triggers CRITICAL"
    inputs:
      file: "test_fixtures/no_alerts_dqs.md"
    expected:
      - type: validation_fail
        severity: CRITICAL
    success_criteria: "Missing alert framework reported as CRITICAL"
