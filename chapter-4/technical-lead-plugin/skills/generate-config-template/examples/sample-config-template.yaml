pipeline:
  name: patient-360-pipeline
  version: "1.0"

environments:
  DEV:
    scheduling:
      # Pipeline execution schedule
      cron_schedule: "0 */4 * * *"
      # Maximum pipeline execution time
      timeout_minutes: 30
    compute:
      # Spark executor memory allocation
      executor_memory: "2g"
      # Number of Spark executors
      num_executors: 1
      # Shuffle partitions for Spark SQL
      shuffle_partitions: 8
    storage:
      # Root path for warehouse data
      warehouse_path: "warehouse/dev"
      # Delta Lake file format
      file_format: "delta"
      # Compression codec
      compression: "snappy"
    error_handling:
      # Maximum retry attempts for failed tasks
      max_retries: 1
      # Retry backoff in seconds
      retry_backoff_seconds: 30
      # Path for dead letter records
      dead_letter_path: "warehouse/dev/dead-letter"
    monitoring:
      # Alerting channel for notifications
      alert_channel: "#data-alerts-dev"
      # Application log level
      log_level: "DEBUG"

  STAGING:
    scheduling:
      cron_schedule: "0 3 * * *"
      timeout_minutes: 60
    compute:
      executor_memory: "4g"
      num_executors: 2
      shuffle_partitions: 32
    storage:
      warehouse_path: "warehouse/staging"
      file_format: "delta"
      compression: "snappy"
    error_handling:
      max_retries: 2
      retry_backoff_seconds: 60
      dead_letter_path: "warehouse/staging/dead-letter"
    monitoring:
      alert_channel: "#data-alerts-staging"
      log_level: "INFO"

  PROD:
    scheduling:
      cron_schedule: "0 2 * * *"
      timeout_minutes: 120
