skill: create-lld
version: "1.0"
cases:
  - id: TC-001
    name: "Complete inputs produce valid LLD"
    description: "Given all 5 upstream artifacts and technical inputs, skill produces an LLD that passes validation"
    inputs:
      folder: "inputs/lld/v1"
      upstream:
        - "outputs/drd/v1"
        - "outputs/hld/v1"
        - "outputs/dms/v1"
        - "outputs/stm/v1"
        - "outputs/dqs/v1"
    expected:
      - type: validation_pass
        description: "LLD passes validate-lld with 0 CRITICAL issues"
      - type: section_present
        sections:
          - "1. Design Overview"
          - "2. Code Architecture"
          - "3. File Formats & Storage Layout"
          - "4. DAG Specification"
          - "5. Task Implementation Details"
          - "6. Performance & Optimization"
          - "7. Configuration Schema"
          - "8. Error Handling"
          - "9. Deployment"
          - "10. Monitoring"
          - "11. Upstream Artifact References"
          - "12. Traceability Matrix"
          - "13. Decision Log"
          - "14. Version History"
      - type: no_vague_language
        banned: ["real-time", "all data", "comprehensive", "fast"]
    success_criteria: "All expected checks pass"

  - id: TC-002
    name: "Upstream artifact traceability maintained"
    description: "LLD must reference all 5 upstream artifacts with section numbers"
    inputs:
      folder: "inputs/lld/v1"
      upstream:
        - "outputs/drd/v1"
        - "outputs/hld/v1"
        - "outputs/dms/v1"
        - "outputs/stm/v1"
        - "outputs/dqs/v1"
    expected:
      - type: content_contains
        patterns: ["DRD §", "HLD §", "DMS §", "STM ", "DQS §"]
    success_criteria: "All 5 upstream artifacts referenced with section numbers"

  - id: TC-003
    name: "Missing infrastructure specs triggers Q&A"
    description: "When infrastructure-specs.md is absent, skill asks user"
    inputs:
      folder: "inputs/lld/v1"
      remove_files: ["infrastructure-specs.md"]
    expected:
      - type: asks_question
        about: "infrastructure"
    success_criteria: "Skill asks about infrastructure specifications"

  - id: TC-004
    name: "DAG specification has task table"
    description: "Section 4 must have a task inventory table with dependencies"
    inputs:
      folder: "inputs/lld/v1"
      upstream:
        - "outputs/drd/v1"
        - "outputs/hld/v1"
        - "outputs/dms/v1"
        - "outputs/stm/v1"
        - "outputs/dqs/v1"
    expected:
      - type: content_contains
        patterns: ["```mermaid", "Task", "Dependency"]
    success_criteria: "DAG specification includes Mermaid diagram and task table"

  - id: TC-005
    name: "Configuration schema has parameter table"
    description: "Section 7 must have configurable parameters with per-environment defaults"
    inputs:
      folder: "inputs/lld/v1"
      upstream:
        - "outputs/drd/v1"
        - "outputs/hld/v1"
    expected:
      - type: content_contains
        patterns: ["Parameter", "Default", "DEV", "PROD"]
    success_criteria: "Configuration schema has parameter inventory with environment overrides"

  - id: TC-006
    name: "Hub document pattern — no duplicated upstream content"
    description: "LLD references upstream sections instead of copying content"
    inputs:
      folder: "inputs/lld/v1"
      upstream:
        - "outputs/drd/v1"
        - "outputs/hld/v1"
        - "outputs/dms/v1"
    expected:
      - type: content_contains
        patterns: ["see DMS", "see HLD", "see DRD"]
    success_criteria: "LLD uses hub document references to upstream artifacts"

  - id: TC-007
    name: "DAG definition YAML generated alongside LLD"
    description: "create-lld produces dag/dag-definition.yaml with valid task list"
    inputs:
      folder: "inputs/lld/v1"
      upstream:
        - "outputs/drd/v1"
        - "outputs/hld/v1"
        - "outputs/dms/v1"
        - "outputs/stm/v1"
        - "outputs/dqs/v1"
    expected:
      - type: file_created
        description: "dag-definition.yaml created in outputs/lld/v{N}/dag/"
      - type: yaml_valid
        description: "Generated YAML has dag_id, tasks array, schedule"
      - type: content_contains
        patterns: ["dag_id", "tasks", "dependencies", "schedule"]
    success_criteria: "DAG definition YAML generated and valid"

  - id: TC-008
    name: "Mermaid DAG diagram exported as .mmd"
    description: "create-lld exports Mermaid diagram from §4.3 to standalone file"
    inputs:
      folder: "inputs/lld/v1"
      upstream:
        - "outputs/drd/v1"
        - "outputs/hld/v1"
        - "outputs/dms/v1"
        - "outputs/stm/v1"
        - "outputs/dqs/v1"
    expected:
      - type: file_created
        description: "dag-pipeline.mmd created in outputs/lld/v{N}/dag/"
      - type: content_contains
        patterns: ["graph TD", "-->"]
    success_criteria: "Mermaid file matches LLD §4.3 diagram"

  - id: TC-009
    name: "Implementation sequence generated alongside LLD"
    description: "create-lld produces impl-sequence.md with build phases"
    inputs:
      folder: "inputs/lld/v1"
      upstream:
        - "outputs/drd/v1"
        - "outputs/hld/v1"
        - "outputs/dms/v1"
        - "outputs/stm/v1"
        - "outputs/dqs/v1"
    expected:
      - type: file_created
        description: "impl-sequence.md created in outputs/lld/v{N}/"
      - type: content_contains
        patterns: ["Phase", "Milestone", "Module"]
    success_criteria: "Implementation sequence has phases, milestones, and module order"
