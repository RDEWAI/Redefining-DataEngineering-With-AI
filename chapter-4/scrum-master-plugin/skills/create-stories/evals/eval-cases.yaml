skill: create-stories
version: "1.0"
cases:
  - id: TC-001
    name: "Complete inputs produce valid backlog"
    description: "Given LLD and all upstream artifacts, skill produces a backlog that passes validation"
    inputs:
      folder: "inputs/stories/v1"
      upstream: "outputs/lld/v1"
    expected:
      - type: validation_pass
        description: "Backlog passes validate-stories with 0 CRITICAL issues"
      - type: file_exists
        patterns:
          - "BACKLOG-*.md"
          - "EPIC-*/EPIC-*.md"
          - "EPIC-*/STORY-*.md"
      - type: no_vague_language
        banned: ["do everything", "all data", "comprehensive", "various"]
    success_criteria: "All expected checks pass"

  - id: TC-002
    name: "Upstream traceability maintained"
    description: "Every story must reference upstream artifact sections"
    inputs:
      folder: "inputs/stories/v1"
      upstream: "outputs/lld/v1"
    expected:
      - type: content_contains
        patterns: ["[LLD"]
    success_criteria: "LLD section references found in story files"

  - id: TC-003
    name: "Missing team capacity triggers Q&A"
    description: "When team-capacity.md is absent, skill asks user"
    inputs:
      folder: "inputs/stories/v1"
      remove_files: ["team-capacity.md"]
    expected:
      - type: asks_question
        about: "capacity"
    success_criteria: "Skill asks about team capacity"

  - id: TC-004
    name: "Story IDs are globally unique"
    description: "Each story has a unique STORY-NN-NNN identifier"
    inputs:
      folder: "inputs/stories/v1"
      upstream: "outputs/lld/v1"
    expected:
      - type: content_contains
        patterns: ["STORY-01-", "STORY-02-"]
    success_criteria: "Story IDs follow STORY-NN-NNN format"

  - id: TC-005
    name: "Dependency graph included"
    description: "Backlog must include a Mermaid dependency diagram"
    inputs:
      folder: "inputs/stories/v1"
      upstream: "outputs/lld/v1"
    expected:
      - type: content_contains
        patterns: ["```mermaid"]
    success_criteria: "Mermaid diagram present in backlog"

  - id: TC-006
    name: "Stories have acceptance criteria"
    description: "Every story must have acceptance criteria with upstream references"
    inputs:
      folder: "inputs/stories/v1"
      upstream: "outputs/lld/v1"
    expected:
      - type: content_contains
        patterns: ["Acceptance Criteria", "- [ ]"]
    success_criteria: "Acceptance criteria with checkboxes present"
