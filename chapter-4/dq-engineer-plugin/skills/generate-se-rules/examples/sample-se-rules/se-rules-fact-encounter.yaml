# SE Rules for analytics.fact_encounter
# Generated from: DQS-2026-03-17-patient-360.md
# Compatible with spark-expectations >= 2.6.0
# Load with: load_rules_from_yaml(this_file, spark, options={"dq_env": "PROD"})
# Product: patient-360
# Rules: 5

product_id: patient-360

dq_env:
  DEV:
    table_name: "dev_analytics.fact_encounter"
    action_if_failed: ignore         # permissive — log but don't block
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 0          # integer % — alert on any drop
    priority: medium
  QA:
    table_name: "qa_analytics.fact_encounter"
    action_if_failed: ignore         # NOT drop — drop only valid for row_dq
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5          # integer % — alert if >5% dropped
    priority: medium
  PROD:
    table_name: "analytics.fact_encounter"
    action_if_failed: fail           # strictest — halt pipeline on failures
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2          # integer % — alert if >2% dropped
    priority: high

rules:
  - rule: DQ-FLD-012
    rule_type: row_dq
    column_name: encounter_sk
    expectation: encounter_sk IS NOT NULL
    action_if_failed: fail
    tag: field_validation
    description: Encounter surrogate key must never be null
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

  - rule: DQ-FLD-013
    rule_type: row_dq
    column_name: patient_sk
    expectation: patient_sk IS NOT NULL
    action_if_failed: fail
    tag: field_validation
    description: Patient FK must never be null on a fact row
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

  - rule: DQ-FLD-014
    rule_type: row_dq
    column_name: encounter_date
    expectation: encounter_date <= CURRENT_DATE
    action_if_failed: ignore
    tag: field_validation
    description: Encounter date must not be in the future
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  - rule: DQ-STA-002
    rule_type: agg_dq
    column_name: ""
    expectation: "count(*) > 40000 and count(*) < 60000"
    action_if_failed: ignore
    tag: statistical_distribution
    description: >
      Encounter row count within ±20% of baseline (50,000 encounters)
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 20
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  - rule: DQ-REC-002
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN ABS(s.cnt - t.cnt) * 100.0 / NULLIF(s.cnt, 0) <= 0.1
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS cnt FROM synthea.encounters) s,
           (SELECT COUNT(*) AS cnt FROM analytics.fact_encounter) t
    action_if_failed: fail
    tag: reconciliation
    description: >
      Encounter count reconciliation: bronze.encounters vs
      analytics.fact_encounter, tolerance ±0.1%
    enable_for_source_dq_validation: true   # query_dq: check both source and target
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high
