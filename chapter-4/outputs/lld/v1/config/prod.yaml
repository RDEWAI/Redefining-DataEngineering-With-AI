# Configuration Template: patient_360 (cookiecutter `project_name`) (prod)
# Auto-generated from LLD Section 7 — Configuration Schema
# Generated by: generate_config_template.py
# Scaffold target: _infra/cd/config/prod.yaml

scaffold_target: _infra/cd/config/prod.yaml
env: prod
pipeline:
  name: patient_360 (cookiecutter `project_name`)
  version: "1.0"

compute:
  # Spark driver memory (DEV default; STAGING 4g, PROD 8g)
  compute_spark_driver_memory: "1g"
  # Spark driver cores
  compute_spark_driver_cores: 1
  # Spark executor memory (DEV default; STAGING 4g, PROD 8g)
  compute_spark_executor_memory: "1g"
  # Spark executor cores
  compute_spark_executor_cores: 1
  # Initial executor count
  compute_spark_num_executors: 1
  # Max executors (dynamic)
  compute_spark_max_executors: 1
  # Shuffle partition count
  compute_spark_shuffle_partitions: 8

error_handling:
  # Bronze task max retries
  retry_bronze_max_attempts: 3
  # Bronze retry delay
  retry_bronze_delay_seconds: 60
  # Silver task max retries
  retry_silver_max_attempts: 2
  # Silver retry delay
  retry_silver_delay_seconds: 120
  # Gold task max retries
  retry_gold_max_attempts: 2
  # Gold retry delay
  retry_gold_delay_seconds: 120
  # Exponential backoff factor
  retry_backoff_multiplier: 2.0
  # Pipeline-level timeout
  pipeline_timeout_minutes: 60

general:
  # Schedule timezone
  scheduling_timezone: "UTC"
  # Max concurrent DAG runs
  scheduling_max_active_runs: 1
  # Enable backfill
  scheduling_catchup: true
  # Enable dynamic allocation
  compute_spark_dynamic_allocation: false
  # Auto-broadcast threshold
  compute_spark_broadcast_threshold: "50m"
  # Source schema name
  pipeline_source_schema: "synthea"
  # Directory containing per-table YAML configs
  ingestion_config_dir: "airflow/configs"
  # Global default when source returns 0 rows
  ingestion_default_empty_input_behavior: "write_empty"
  # Per-table DQ rules directory (one `{table}.yml` per table) for convention-based discovery
  ingestion_dq_rules_dir: "dq_rules"
  # How DQ rules are matched to tables (by table name tag)
  ingestion_dq_rules_convention: "table_name"
  # Entry point module for SparkSubmitOperator
  ingestion_spark_submit_class: "patient_360.bronze.ingestion_runner"

monitoring:
  # PagerDuty service
  alerting_critical_channel: "p360-critical"
  # Slack channel
  alerting_warning_channel: "#data-alerts-dev"
  # Enable PagerDuty alerts
  alerting_pagerduty_enabled: false
  # Allergy elevated path
  alerting_allergy_escalation: true
  # OTel collector endpoint
  monitoring_opentelemetry_endpoint: "http://localhost:4317"
  # Marquez API endpoint
  monitoring_marquez_endpoint: "http://localhost:5001"
  # Grafana endpoint
  monitoring_grafana_endpoint: "http://localhost:3000"
  # Unity Catalog OSS REST API endpoint (local, all envs) [infrastructure-specs.md §4]
  catalog_unity_catalog_url: "http://localhost:8080/api/2.1/unity-catalog"
  # Default catalog name registered in UC OSS
  catalog_catalog_name: "spark_catalog"
  # UC OSS service URI consumed by the Bronze runner via the `UC_URI` env var
  catalog_uc_uri: "http://unity-catalog:8080"
  # UC catalog name housing the Bronze schema
  catalog_bronze_catalog_name: "unity"
  # UC schema name for Bronze Delta tables
  catalog_bronze_schema: "bronze"
  # UC catalog name the pure-Python REST bootstrap client targets (Decision 17 v1.18). Env var: UC_BOOTSTRAP_CATALOG_NAME.
  uc_bootstrap_catalog_name: "unity"
  # UC OSS REST base URL the bootstrap client GETs/POSTs against (Decision 17 v1.18).
  # PROD runs the bootstrap from within the cluster network — use the in-network hostname.
  # Env var: UC_BOOTSTRAP_URI.
  uc_bootstrap_uri: "http://unity-catalog:8080"
  # HTTP client timeout per REST request (seconds) — Decision 17 v1.18. Env var: UC_BOOTSTRAP_TIMEOUT_SECONDS.
  uc_bootstrap_timeout_seconds: 30

scheduling:
  # Airflow schedule interval
  scheduling_cron: 0

storage:
  # Root storage path
  storage_base_path: "warehouse/dev"
  # Table format
  storage_format: "delta"
  # Compression codec
  storage_compression: "snappy"
  # Target file size
  storage_target_file_size_mb: 128
  # Time travel window
  storage_vacuum_retention_hours: 168
  # Auto compaction
  storage_auto_compact: false
  # Dead-letter path for schema/FK rejection records
  storage_dead_letter_path: "warehouse/dev/dead-letter"
  # SE drop-action quarantine root; per-table path = `{quarantine_path}/bronze/{table}/
  storage_quarantine_path: "warehouse/dev/quarantine"
  # Checkpoint path
  storage_checkpoint_path: "warehouse/dev/checkpoints"
  # Local filesystem path for Delta warehouse
  catalog_warehouse_path: "warehouse/dev"
  # Per-table SE drop-action quarantine path; resolved at runtime by `se_runner.py` using `storage.quarantine_path` root
  ingestion_quarantine_path: "warehouse/{env}/quarantine/bronze/{table}/"
