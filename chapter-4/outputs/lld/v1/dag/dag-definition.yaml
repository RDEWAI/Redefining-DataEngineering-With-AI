# DAG Definition: Patient 360 Medallion Pipeline
# Generated from: LLD-2026-03-23-patient-360.md Section 4 (v1.2)
# Generated: 2026-03-23
#
# This file defines the Airflow DAG structure for the Patient 360 pipeline.
# Use this as the source of truth for task inventory, dependencies, and scheduling.
#
# v1.2 changes: Replaced 3 standalone dq_gate_* tasks with inline SE validation
# (row_dq + agg_dq via action_if_failed) within each task, plus 3 slim
# reconciliation tasks (reconciliation_bronze/silver/gold) for cross-table
# query_dq checks only (row count reconciliation, freshness, completeness).

dag:
  dag_id: patient360_hourly_v1
  description: "Patient 360 Medallion Pipeline - Bronze/Silver/Gold with inline SE + reconciliation"
  schedule: "0 * * * *"
  timezone: UTC
  catchup: true
  max_active_runs: 1
  concurrency: 16
  tags:
    - patient-360
    - medallion
    - hourly

  default_args:
    owner: data-engineering
    depends_on_past: false
    email_on_failure: true
    email_on_retry: false
    retries: 2
    retry_delay_seconds: 120
    execution_timeout_minutes: 60

  # ── Bronze Ingestion Framework Configuration ───────────────────────
  # The bronze_ingestion TaskGroup is NOT defined as static tasks below.
  # Instead, it is generated at DAG parse time by the ingestion factory:
  #
  #   from src.pipelines.bronze.ingestion_factory import create_bronze_taskgroup
  #   bronze_tg = create_bronze_taskgroup(
  #       config_dir="src/config/tables",
  #       dag=dag
  #   )
  #
  # The factory reads all *.yaml files from config_dir and creates one
  # SparkSubmitOperator wrapper task per file inside a TaskGroup named
  # "bronze_ingestion". Task IDs follow the pattern:
  #   bronze_ingestion.ingest_{table_name}
  #
  # Each bronze task calls spark-expectations INLINE for row_dq and agg_dq
  # checks using action_if_failed (fail/drop/ignore) from the per-table YAML.
  # DQ rules are auto-discovered by table name convention from bronze_rules.yaml.
  # Empty-input behavior defaults to write_empty; critical tables override to fail.

  ingestion_framework:
    enabled: true
    factory_module: src.pipelines.bronze.ingestion_factory
    factory_function: create_bronze_taskgroup
    config_dir: src/config/tables
    spark_submit_class: src.pipelines.bronze.ingestion_runner
    dq_rules_file: src/quality/rules/bronze_rules.yaml
    dq_rules_convention: table_name
    default_empty_input_behavior: write_empty
    taskgroup_id: bronze_ingestion
    # Inline SE configuration for all bronze tasks
    inline_se:
      enabled: true
      rule_types: [row_dq, agg_dq]
      default_action_if_failed: drop  # non-critical tables drop failing rows
      # Critical tables override to fail in their per-table YAML config

  # Per-table configs (reference only -- actual configs in src/config/tables/)
  bronze_table_configs:
    - table: patients
      config_file: tables/patients.yaml
      empty_input_behavior: fail       # override: required for downstream
      action_if_failed: fail           # inline SE: fail on any CRITICAL rule
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: encounters
      config_file: tables/encounters.yaml
      empty_input_behavior: fail       # override: required for Gold
      action_if_failed: fail           # inline SE: fail on any CRITICAL rule
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: conditions
      config_file: tables/conditions.yaml
      empty_input_behavior: write_empty  # default
      action_if_failed: drop           # inline SE: quarantine failing rows
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: medications
      config_file: tables/medications.yaml
      empty_input_behavior: write_empty  # default
      action_if_failed: drop           # inline SE: quarantine failing rows
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: observations
      config_file: tables/observations.yaml
      empty_input_behavior: write_empty  # default
      action_if_failed: drop           # inline SE: quarantine failing rows
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: allergies
      config_file: tables/allergies.yaml
      empty_input_behavior: fail       # override: safety critical [DRD §1.3]
      action_if_failed: fail           # inline SE: fail on any rule
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: immunizations
      config_file: tables/immunizations.yaml
      empty_input_behavior: write_empty  # default
      action_if_failed: drop           # inline SE: quarantine failing rows
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: procedures
      config_file: tables/procedures.yaml
      empty_input_behavior: write_empty  # default
      action_if_failed: drop           # inline SE: quarantine failing rows
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: claims
      config_file: tables/claims.yaml
      empty_input_behavior: write_empty  # default
      action_if_failed: drop           # inline SE: quarantine failing rows
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: careplans
      config_file: tables/careplans.yaml
      empty_input_behavior: write_empty  # default
      action_if_failed: drop           # inline SE: quarantine failing rows
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: organizations
      config_file: tables/organizations.yaml
      empty_input_behavior: fail       # override: FK dimension
      action_if_failed: fail           # inline SE: fail on any CRITICAL rule
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: providers
      config_file: tables/providers.yaml
      empty_input_behavior: fail       # override: FK dimension
      action_if_failed: fail           # inline SE: fail on any CRITICAL rule
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

    - table: payers
      config_file: tables/payers.yaml
      empty_input_behavior: fail       # override: FK dimension
      action_if_failed: fail           # inline SE: fail on any CRITICAL rule
      timeout_minutes: 30
      retries: 3
      retry_delay_seconds: 60

  task_groups:
    - group_id: bronze_ingestion
      description: "Config-driven parallel ingestion of 13 source tables with inline SE (factory-generated)"
      layer: bronze
      generation: factory  # Generated by ingestion_factory, not static task definitions

    - group_id: silver_dimensions
      description: "SCD Type 2 dimension processing with inline SE (must complete before facts)"
      layer: silver

    - group_id: silver_facts
      description: "Fact table transformations with inline SE (depend on dimension completion)"
      layer: silver

    - group_id: gold_build
      description: "Consumer table denormalization with inline SE"
      layer: gold

    - group_id: observability
      description: "Lineage and metrics emission"
      layer: observability

  tasks:
    # ── Reconciliation: Bronze (query_dq cross-table checks) ─────────
    # Depends on the entire bronze_ingestion TaskGroup (all 13 tasks)
    # Row_dq and agg_dq already handled inline within each bronze task.
    # This task runs ONLY query_dq rules: row count reconciliation,
    # freshness checks, completeness assertions [DQS §4].
    - task_id: reconciliation_bronze
      group: null
      type: sql_query_dq
      module: src.quality.reconciliation
      dependencies:
        - bronze_ingestion  # TaskGroup dependency -- waits for all 13 tasks
      timeout_minutes: 20
      retries: 1
      retry_delay_seconds: 60
      retry_backoff: fixed
      checks:
        - row_count_reconciliation  # source vs bronze per table
        - data_freshness            # bronze tables updated within tolerance
        - completeness              # critical tables have non-zero rows
      on_critical_failure: "block_silver"
      alert_channel: "p360-critical"

    # ── Silver Layer: Dimensions (4 SCD2 tasks in parallel, inline SE) ──
    - task_id: transform_patients_silver
      group: silver_dimensions
      type: pyspark_scd2
      module: src.pipelines.silver.transform_patients
      dependencies:
        - reconciliation_bronze
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_patients/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_patients/"
      scd2: true
      inline_se:
        rules: "DQ-FLD-046 to DQ-FLD-059, DQ-FLD-102 to DQ-FLD-104"
        action_if_failed: fail
      empty_input_behavior: fail

    - task_id: transform_organizations_silver
      group: silver_dimensions
      type: pyspark_scd2
      module: src.pipelines.silver.transform_organizations
      dependencies:
        - reconciliation_bronze
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_organizations/ds={ds}/"
      output: "warehouse/{env}/silver/reference/reference_organizations/"
      scd2: true
      inline_se:
        rules: "DQ-FLD-095 to DQ-FLD-096"
        action_if_failed: fail
      empty_input_behavior: fail

    - task_id: transform_providers_silver
      group: silver_dimensions
      type: pyspark_scd2
      module: src.pipelines.silver.transform_providers
      dependencies:
        - reconciliation_bronze
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_providers/ds={ds}/"
      output: "warehouse/{env}/silver/reference/reference_providers/"
      scd2: true
      inline_se:
        rules: "DQ-FLD-097 to DQ-FLD-099"
        action_if_failed: fail
      empty_input_behavior: fail

    - task_id: transform_payers_silver
      group: silver_dimensions
      type: pyspark_scd2
      module: src.pipelines.silver.transform_payers
      dependencies:
        - reconciliation_bronze
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_payers/ds={ds}/"
      output: "warehouse/{env}/silver/reference/reference_payers/"
      scd2: true
      inline_se:
        rules: "DQ-FLD-100 to DQ-FLD-101"
        action_if_failed: fail
      empty_input_behavior: fail

    # ── Silver Layer: Facts (depend on dimensions, inline SE) ────────
    - task_id: transform_encounters_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_encounters
      dependencies:
        - transform_patients_silver
        - transform_organizations_silver
        - transform_providers_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_encounters/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_encounters/"
      inline_se:
        rules: "DQ-FLD-060 to DQ-FLD-065"
        action_if_failed: fail
      empty_input_behavior: fail

    - task_id: transform_conditions_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_conditions
      dependencies:
        - transform_encounters_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_conditions/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_conditions/"
      inline_se:
        rules: "DQ-FLD-066 to DQ-FLD-070"
        action_if_failed: drop
      empty_input_behavior: write_empty

    - task_id: transform_medications_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_medications
      dependencies:
        - transform_encounters_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_medications/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_medications/"
      inline_se:
        rules: "DQ-FLD-071 to DQ-FLD-076"
        action_if_failed: drop
      empty_input_behavior: write_empty

    - task_id: transform_observations_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_observations
      dependencies:
        - transform_encounters_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_observations/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_observations/"
      inline_se:
        rules: "DQ-FLD-077 to DQ-FLD-079"
        action_if_failed: drop
      empty_input_behavior: write_empty

    - task_id: transform_allergies_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_allergies
      dependencies:
        - transform_patients_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_allergies/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_allergies/"
      inline_se:
        rules: "DQ-FLD-080 to DQ-FLD-083"
        action_if_failed: fail  # safety critical
      empty_input_behavior: fail

    - task_id: transform_immunizations_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_immunizations
      dependencies:
        - transform_encounters_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_immunizations/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_immunizations/"
      inline_se:
        rules: "DQ-FLD-088 to DQ-FLD-090"
        action_if_failed: drop
      empty_input_behavior: write_empty

    - task_id: transform_procedures_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_procedures
      dependencies:
        - transform_encounters_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_procedures/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_procedures/"
      inline_se:
        rules: "DQ-FLD-084 to DQ-FLD-087"
        action_if_failed: drop
      empty_input_behavior: write_empty

    - task_id: transform_claims_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_claims
      dependencies:
        - transform_encounters_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_claims/ds={ds}/"
      output: "warehouse/{env}/silver/billing/billing_claims/"
      inline_se:
        rules: "DQ-FLD-093 to DQ-FLD-094"
        action_if_failed: drop
      empty_input_behavior: write_empty

    - task_id: transform_careplans_silver
      group: silver_facts
      type: pyspark
      module: src.pipelines.silver.transform_careplans
      dependencies:
        - transform_encounters_silver
      timeout_minutes: 45
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "warehouse/{env}/bronze/synthea_careplans/ds={ds}/"
      output: "warehouse/{env}/silver/clinical/clinical_careplans/"
      inline_se:
        rules: "DQ-FLD-091 to DQ-FLD-092"
        action_if_failed: drop
      empty_input_behavior: write_empty

    # ── Reconciliation: Silver (query_dq cross-table checks) ─────────
    # Row_dq and agg_dq already handled inline within each silver task.
    # This task runs ONLY query_dq rules: row count reconciliation,
    # FK orphan cross-checks, SCD2 version count sanity [DQS §4].
    - task_id: reconciliation_silver
      group: null
      type: sql_query_dq
      module: src.quality.reconciliation
      dependencies:
        - transform_patients_silver
        - transform_encounters_silver
        - transform_conditions_silver
        - transform_medications_silver
        - transform_observations_silver
        - transform_allergies_silver
        - transform_immunizations_silver
        - transform_procedures_silver
        - transform_claims_silver
        - transform_careplans_silver
        - transform_organizations_silver
        - transform_providers_silver
        - transform_payers_silver
      timeout_minutes: 20
      retries: 1
      retry_delay_seconds: 60
      retry_backoff: fixed
      checks:
        - row_count_reconciliation  # bronze vs silver per table
        - fk_orphan_cross_check     # FK references resolve
        - scd2_version_sanity       # version count within expected range
      on_critical_failure: "block_gold"
      alert_channel: "p360-critical"

    # ── Gold Layer (3 consumer tables, inline SE) ────────────────────
    - task_id: build_patient_summary_gold
      group: gold_build
      type: pyspark
      module: src.pipelines.gold.build_patient_summary
      dependencies:
        - reconciliation_silver
      timeout_minutes: 30
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "clinical_patients, clinical_encounters, clinical_conditions, clinical_medications, clinical_allergies"
      output: "warehouse/{env}/gold/patient_summary/"
      inline_se:
        rules: "DQ-FLD-105 to DQ-FLD-140"
        action_if_failed: fail
      empty_input_behavior: fail

    - task_id: build_clinical_history_gold
      group: gold_build
      type: pyspark
      module: src.pipelines.gold.build_patient_clinical_history
      dependencies:
        - reconciliation_silver
      timeout_minutes: 30
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "clinical_patients, clinical_encounters, clinical_conditions, clinical_medications, clinical_observations, clinical_procedures, clinical_immunizations, clinical_careplans"
      output: "warehouse/{env}/gold/patient_clinical_history/"
      inline_se:
        rules: "Gold patient_clinical_history rules"
        action_if_failed: fail
      empty_input_behavior: fail

    - task_id: build_billing_summary_gold
      group: gold_build
      type: pyspark
      module: src.pipelines.gold.build_patient_billing_summary
      dependencies:
        - reconciliation_silver
      timeout_minutes: 30
      retries: 2
      retry_delay_seconds: 120
      retry_backoff: exponential
      input: "clinical_patients, clinical_encounters, billing_claims, reference_payers"
      output: "warehouse/{env}/gold/patient_billing_summary/"
      inline_se:
        rules: "Gold patient_billing_summary rules"
        action_if_failed: fail
      empty_input_behavior: fail

    # ── Reconciliation: Gold (query_dq cross-table checks) ───────────
    # Row_dq and agg_dq already handled inline within each gold task.
    # This task runs ONLY query_dq rules: row count reconciliation,
    # patient completeness, allergy completeness [DQS §4].
    - task_id: reconciliation_gold
      group: null
      type: sql_query_dq
      module: src.quality.reconciliation
      dependencies:
        - build_patient_summary_gold
        - build_clinical_history_gold
        - build_billing_summary_gold
      timeout_minutes: 20
      retries: 1
      retry_delay_seconds: 60
      retry_backoff: fixed
      checks:
        - row_count_reconciliation    # silver vs gold per table
        - patient_completeness        # = 5,767 patients
        - allergy_completeness        # all patient allergies present
      on_critical_failure: "block_consumer_access"
      alert_channel: "p360-critical"

    # ── Observability ─────────────────────────────────────────────────
    - task_id: emit_lineage
      group: observability
      type: openlineage
      module: src.utils.metrics
      dependencies:
        - reconciliation_gold
      timeout_minutes: 10
      retries: 2
      retry_delay_seconds: 30
      retry_backoff: exponential

    - task_id: emit_metrics
      group: observability
      type: opentelemetry
      module: src.utils.metrics
      dependencies:
        - reconciliation_gold
      timeout_minutes: 10
      retries: 2
      retry_delay_seconds: 30
      retry_backoff: exponential

# ── Critical Path ───────────────────────────────────────────────────
# Estimated: ~30 minutes (reduced from ~33 min; inline SE eliminates
# standalone DQ gate overhead)
# bronze_ingestion.ingest_observations (~5 min, inline SE row_dq+agg_dq)
#   -> reconciliation_bronze (~2 min, query_dq cross-table checks)
#     -> transform_patients_silver (~3 min, inline SE)
#       -> transform_encounters_silver (~4 min, inline SE)
#         -> transform_observations_silver (~8 min, inline SE)
#           -> reconciliation_silver (~2 min, query_dq cross-table checks)
#             -> build_patient_summary_gold (~3 min, inline SE)
#               -> reconciliation_gold (~2 min, query_dq cross-table checks)
#                 -> emit_lineage + emit_metrics (~1 min)
