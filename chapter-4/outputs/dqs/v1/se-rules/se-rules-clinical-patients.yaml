  # --- Statistical Distribution (agg_dq) ---
  - rule: DQ-STA-014
    rule_type: agg_dq
    column_name: ""
    expectation: "count(*) > 5652 and count(*) < 5882"
    action_if_failed: fail
    tag: statistical_distribution
    description: "Current patient row count within +/-2% of baseline (5,767) -- patient-critical"
    enable_for_source_dq_validation: false
