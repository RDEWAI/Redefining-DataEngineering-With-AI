[project]
name = "chapter-3-ai-engineering"
version = "0.1.0"
description = "Chapter 3: AI Engineering with Library Management Data"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Data & Database
    "duckdb>=1.1.3",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",

    # Visualization (sandbox whitelist)
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # MCP Server
    "fastmcp>=0.4.0",

    # LLM Integration
    "openai>=1.0.0",  # OpenAI SDK for OpenRouter

    # Embeddings (optional - installed on demand for Phase 5)
    # "sentence-transformers>=2.2.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
