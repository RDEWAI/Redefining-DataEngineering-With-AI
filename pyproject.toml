[project]
name = "redefining-dataengineering-with-ai"
version = "0.1.0"
description = "Redefining Data Engineering with AI - Modern data engineering pipeline using DuckDB, SQLMesh, and Apache Superset"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pytest==8.3.4",
    "duckdb==1.1.3",
    "duckdb-engine>=0.13.0",
    "marshmallow>=3.18,<4",
    "sqlmesh>=0.130.0,<1",
    "apache-superset==4.1.1",
    "setuptools>=65.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]
