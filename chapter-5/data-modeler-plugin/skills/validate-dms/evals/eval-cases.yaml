skill: validate-dms
version: "1.0"
cases:
  - id: TC-001
    name: "Valid DMS passes validation"
    description: "A complete, well-formed DMS passes with 0 CRITICAL issues"
    inputs:
      file: "test_fixtures/valid_dms.md"
    expected:
      - type: validation_pass
      - type: exit_code
        code: 0
    success_criteria: "Validator returns exit code 0, no CRITICAL issues"

  - id: TC-002
    name: "Missing sections caught as CRITICAL"
    description: "DMS missing required sections triggers CRITICAL findings"
    inputs:
      file: "test_fixtures/minimal_invalid_dms.md"
    expected:
      - type: validation_fail
        severity: CRITICAL
      - type: exit_code
        code: 1
    success_criteria: "Missing sections reported as CRITICAL"

  - id: TC-003
    name: "Invalid YAML blocks caught"
    description: "DMS with malformed YAML schema blocks triggers CRITICAL"
    inputs:
      file: "test_fixtures/invalid_yaml_dms.md"
    expected:
      - type: validation_fail
        severity: CRITICAL
    success_criteria: "Malformed YAML reported as CRITICAL"

  - id: TC-004
    name: "Missing HLD traceability caught"
    description: "DMS without HLD references triggers WARNING"
    inputs:
      file: "test_fixtures/no_traceability_dms.md"
    expected:
      - type: validation_fail
        severity: WARNING
    success_criteria: "Missing traceability reported as WARNING"
