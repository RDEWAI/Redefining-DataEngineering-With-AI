# {{cookiecutter.project_name}} local dev stack (LLD §9.1).
# Pinned versions: see inputs/code/v1/LIBRARIES.md.
#
# Services:
#   unity-catalog    : Unity Catalog OSS 0.4.0 (catalog/metastore for Delta on local FS)
#   unity-catalog-ui : Unity Catalog UI 0.4.0 (browser UI on :3001)
#   marquez          : Marquez 0.51.1 (OpenLineage backend)
#   marquez-db       : Postgres 14 backing Marquez
#   airflow          : Airflow 3.2.1 standalone — runs DAGs from airflow/dags/
#                      with Spark embedded (local[2]); no sidecar Spark cluster.
#   otel-collector   : OpenTelemetry collector (OTLP gRPC :4317, HTTP :4318)
services:
  unity-catalog:
    image: unitycatalog/unitycatalog:v0.4.0
    container_name: "{{cookiecutter.project_name}}-uc"
    networks:
      default:
        # Required so the unity-catalog-ui express proxy can resolve the
        # server by hostname `server` on first boot.
        aliases: [server]
    ports:
      - "8080:8080"
    volumes:
      - ./uc-oss/etc:/home/unitycatalog/etc
      - uc-data:/home/unitycatalog/etc/data
    healthcheck:
      test: ["CMD-SHELL", "(wget -qO- http://localhost:8080/api/2.1/unity-catalog/catalogs || exec 3<>/dev/tcp/localhost/8080) || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  unity-catalog-ui:
    image: unitycatalog/unitycatalog-ui:v0.4.0
    container_name: "{{cookiecutter.project_name}}-uc-ui"
    depends_on:
      unity-catalog:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      UC_URI_PROXY_TARGET: http://server:8080

  marquez-db:
    image: postgres:14
    container_name: "{{cookiecutter.project_name}}-marquez-db"
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    volumes:
      - marquez-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 10s
      timeout: 5s
      retries: 10

  marquez:
    image: marquezproject/marquez:0.51.1
    container_name: "{{cookiecutter.project_name}}-marquez"
    depends_on:
      marquez-db:
        condition: service_healthy
    ports:
      - "5001:5000"   # API
      - "5002:5001"   # admin
    environment:
      MARQUEZ_DB_HOST: marquez-db
      MARQUEZ_DB_PORT: 5432
      MARQUEZ_DB_NAME: marquez
      MARQUEZ_DB_USER: marquez
      MARQUEZ_DB_PASSWORD: marquez

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: "{{cookiecutter.project_name}}-airflow:local"
    container_name: "{{cookiecutter.project_name}}-airflow"
    depends_on:
      unity-catalog:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: "/opt/airflow/dags:/opt/{{cookiecutter.project_name}}/src"
      # In-airflow Spark (LLD §6.1 local_executor_mode = in-airflow-local[*]).
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"local[2]"}'
      # Per-task entry-script paths (auto-generated by /developer-plugin:create-dag
      # from LLD §4.2 task inventory; see airflow/jobs/run_*.py).
      BRONZE_RUNNER_APP: /opt/airflow/jobs/run_bronze_ingestion.py
      BRONZE_RECON_APP: /opt/airflow/jobs/run_bronze_recon.py
      # Env-driven config locations consumed by generated runners + DAG factory.
      AIRFLOW_CONFIGS_DIR: /opt/airflow/configs
      DQ_RULES_DIR: "/opt/{{cookiecutter.project_name}}/dq_rules"
      UC_URI: http://unity-catalog:8080
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/jobs:/opt/airflow/jobs
      - ../../airflow/configs:/opt/airflow/configs
      - ../../src:/opt/{{cookiecutter.project_name}}/src
      - ../../contracts:/opt/{{cookiecutter.project_name}}/contracts
      - ../../dq_rules:/opt/{{cookiecutter.project_name}}/dq_rules
      - ../../data:/opt/{{cookiecutter.project_name}}/data
      - ../../uc-warehouse:/tmp/uc-warehouse
    command: ["standalone"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    container_name: "{{cookiecutter.project_name}}-otel"
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-config.yaml:/etc/otel/config.yaml
    command: ["--config", "/etc/otel/config.yaml"]

volumes:
  uc-data:
  marquez-db:
