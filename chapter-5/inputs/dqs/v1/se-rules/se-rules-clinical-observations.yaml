rules:
  - rule: DQ-FLD-077
    rule_type: row_dq
    column_name: patient_id
    expectation: "patient_id IS NOT NULL"
    action_if_failed: fail
    tag: field_validation
    description: "Observation patient FK must not be null"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

  - rule: DQ-FLD-078
    rule_type: row_dq
    column_name: encounter_id
    expectation: "encounter_id IS NOT NULL"
    action_if_failed: fail
    tag: field_validation
    description: "Observation encounter FK must not be null"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

  - rule: DQ-FLD-079
    rule_type: row_dq
    column_name: loinc_code
    expectation: "loinc_code IS NOT NULL"
