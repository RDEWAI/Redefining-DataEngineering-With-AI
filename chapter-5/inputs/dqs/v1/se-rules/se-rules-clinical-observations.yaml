    tag: field_validation
    description: "LOINC code should not be null"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  # --- Null Rate Baselines (agg_dq) ---
  - rule: DQ-STA-026
    rule_type: agg_dq
    column_name: ""
    expectation: "count(CASE WHEN observation_value IS NULL THEN 1 END) * 100.0 / count(*) > 0 and count(CASE WHEN observation_value IS NULL THEN 1 END) * 100.0 / count(*) < 20"
    action_if_failed: ignore
    tag: statistical_distribution
    description: "observation_value null rate baseline 5.0% -- WARNING if >11%, CRITICAL if >20%"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  - rule: DQ-STA-027
    rule_type: agg_dq
    column_name: ""
    expectation: "count(CASE WHEN units IS NULL THEN 1 END) * 100.0 / count(*) > 4 and count(CASE WHEN units IS NULL THEN 1 END) * 100.0 / count(*) < 25"
    action_if_failed: ignore
    tag: statistical_distribution
    description: "units null rate baseline 10.0% -- WARNING if >16%, CRITICAL if >25%"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  # --- Referential Integrity (query_dq) ---
  - rule: DQ-REF-008
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_observations o
            LEFT JOIN clinical.clinical_patients p ON o.patient_id = p.patient_id
            WHERE p.patient_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Observations must have matching patient -- Reject + Quarantine"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  - rule: DQ-REF-009
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_observations o
            LEFT JOIN clinical.clinical_encounters e ON o.encounter_id = e.encounter_id
            WHERE e.encounter_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Observations must have matching encounter -- Reject + Quarantine"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high
