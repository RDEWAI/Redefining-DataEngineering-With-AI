  - rule: DQ-REF-018
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM reference.reference_providers p
            LEFT JOIN reference.reference_organizations o ON p.organization_id = o.organization_id
            WHERE o.organization_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Providers must have matching organization -- Reject + Quarantine"
