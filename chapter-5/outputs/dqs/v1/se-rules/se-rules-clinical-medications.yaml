  - rule: DQ-STA-025
    rule_type: agg_dq
    column_name: ""
    expectation: "count(CASE WHEN stop_date IS NULL THEN 1 END) * 100.0 / count(*) > 0 and count(CASE WHEN stop_date IS NULL THEN 1 END) * 100.0 / count(*) < 20"
    action_if_failed: ignore
    tag: statistical_distribution
    description: "stop_date null rate baseline 5.2% -- WARNING if >11%, CRITICAL if >20%"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  # --- Referential Integrity (query_dq) ---
  - rule: DQ-REF-006
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_medications m
            LEFT JOIN clinical.clinical_patients p ON m.patient_id = p.patient_id
            WHERE p.patient_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Medications must have matching patient -- Reject + Quarantine"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  - rule: DQ-REF-007
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_medications m
            LEFT JOIN clinical.clinical_encounters e ON m.encounter_id = e.encounter_id
            WHERE e.encounter_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Medications must have matching encounter -- Reject + Quarantine"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  # --- Reconciliation (query_dq) ---
  - rule: DQ-REC-006
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN ABS(s.cnt - t.cnt) * 100.0 / NULLIF(s.cnt, 0) <= 1.0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS cnt FROM bronze.synthea_conditions) s,
           (SELECT SUM(condition_count) AS cnt FROM analytics.patient_clinical_history) t
    action_if_failed: ignore
    tag: reconciliation
    description: "Conditions count vs SUM(condition_count) in clinical history -- +/-1% tolerance [SLA SS3]"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: medium
