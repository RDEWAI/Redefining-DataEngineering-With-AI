  # --- Freshness (query_dq) ---
  - rule: DQ-FRS-001
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - MAX(_ingested_at))) / 3600 <= 1
      THEN 1 ELSE 0 END
      FROM analytics.patient_summary
    action_if_failed: fail
    tag: freshness
    description: "Clinical Dashboard SLA -- patient_summary must be refreshed within 1 hour [DRD SS4.4]"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
