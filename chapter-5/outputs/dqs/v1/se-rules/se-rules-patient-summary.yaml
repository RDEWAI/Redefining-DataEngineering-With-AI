  # --- Referential Integrity -- Gold FK (query_dq) ---
  # (patient_summary is the parent table -- FKs are checked on child tables)

  # --- Reconciliation (query_dq) ---
  - rule: DQ-REC-003
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN ABS(s.cnt - t.cnt) * 100.0 / NULLIF(s.cnt, 0) <= 0.1
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS cnt FROM clinical.clinical_patients WHERE is_current = true) s,
           (SELECT COUNT(*) AS cnt FROM analytics.patient_summary) t
    action_if_failed: fail
    tag: reconciliation
    description: "Silver-to-Gold patient count -- +/-0.1% tolerance [SLA SS3]"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  - rule: DQ-REC-010
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN ABS(s.cnt - t.cnt) * 100.0 / NULLIF(s.cnt, 0) <= 0.1
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(DISTINCT Id) AS cnt FROM synthea.patients) s,
           (SELECT COUNT(DISTINCT patient_id) AS cnt FROM analytics.patient_summary) t
    action_if_failed: fail
    tag: reconciliation
    description: "Distinct patient count reconciliation source vs Gold -- +/-0.1% [SLA SS3]"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
