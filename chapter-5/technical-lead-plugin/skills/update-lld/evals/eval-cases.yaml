skill: update-lld
version: "1.0"
cases:
  - id: TC-001
    name: "Version incremented on update"
    description: "Updating an LLD must increment the version number"
    inputs:
      existing_lld: "outputs/lld/v1/LLD-2026-03-22-patient-360.md"
      change: "Update DAG scheduling from daily to hourly"
    expected:
      - type: content_contains
        patterns: ["Version"]
    success_criteria: "Version number is incremented after update"

  - id: TC-002
    name: "Unchanged sections preserved"
    description: "Sections not affected by the update must be preserved"
    inputs:
      existing_lld: "outputs/lld/v1/LLD-2026-03-22-patient-360.md"
      change: "Update deployment section only"
    expected:
      - type: section_present
        sections:
          - "1. Design Overview"
          - "4. DAG Specification"
          - "7. Configuration Schema"
    success_criteria: "All 14 sections present after update"

  - id: TC-003
    name: "Cross-section consistency after update"
    description: "Update to one section must trigger consistency check across related sections"
    inputs:
      existing_lld: "outputs/lld/v1/LLD-2026-03-22-patient-360.md"
      change: "Change compute resources"
    expected:
      - type: content_contains
        patterns: ["Performance", "Configuration", "Deployment"]
    success_criteria: "Related sections assessed for consistency"

  - id: TC-004
    name: "DAG changes trigger derived artifact re-generation"
    description: "When §4 task dependencies change, dag-definition.yaml and impl-sequence.md are re-generated"
    inputs:
      existing_lld: "outputs/lld/v1"
      change: "Add new Silver task with dependency on transform_patients_silver"
    expected:
      - type: content_contains
        patterns: ["dag-definition.yaml", "impl-sequence.md"]
    success_criteria: "Derived artifacts re-generated after DAG structure change"

  - id: TC-005
    name: "Bronze runner change triggers UC saveAsTable + create-ingestion reminder"
    description: "Editing §2.3 Bronze runner output must keep UCSingleCatalog saveAsTable wiring (Decision 15) and prompt for create-ingestion regeneration"
    inputs:
      existing_lld: "outputs/lld/v1"
      change: "Add a 14th Bronze table"
    expected:
      - type: content_contains
        patterns:
          - "UCSingleCatalog"
          - "saveAsTable"
          - "unity.bronze"
          - "Decision 15"
      - type: content_contains
        patterns: ["create-ingestion"]
    success_criteria: "§2.3 / §5.1 still UC-managed; user prompted to regenerate Bronze runner"

  - id: TC-006
    name: "local_executor_mode change updates Dockerfile + bootstrap AC"
    description: "Switching §6.1 local_executor_mode triggers Dockerfile.airflow + docker-compose.yml + bootstrap story AC updates"
    inputs:
      existing_lld: "outputs/lld/v1"
      change: "Switch local_executor_mode from in-airflow-local[*] to sidecar-spark"
    expected:
      - type: content_contains
        patterns:
          - "local_executor_mode"
          - "Dockerfile.airflow"
          - "docker-compose.yml"
          - "STORIES-BOOTSTRAP-COVERAGE-001"
    success_criteria: "Mode change cascades to runtime stack and bootstrap AC wording"

  - id: TC-007
    name: "Reject spark-expectations pin below 2.10"
    description: "Any update that pins spark-expectations <2.10 must be rejected (YAML rule loader floor)"
    inputs:
      existing_lld: "outputs/lld/v1"
      change: "Pin spark-expectations to 2.6.0 to match a downstream lib"
    expected:
      - type: content_contains
        patterns:
          - "2.10"
          - "library-imports.yaml"
          - "floor"
    success_criteria: "Update is flagged as a contradiction; pin stays >=2.10.0"

  - id: TC-008
    name: "New §4.2 task type prompts wrapper auto-generation"
    description: "Adding a new task type to §4.2 must surface the airflow/jobs/run_<task_type>.py regeneration step"
    inputs:
      existing_lld: "outputs/lld/v1"
      change: "Add a `bronze_lineage` task type for OpenLineage emission"
    expected:
      - type: content_contains
        patterns:
          - "airflow/jobs/run_"
          - "create-dag"
          - "RUNNER_APP"
    success_criteria: "User reminded to re-run create-dag and add the new env-var binding"
