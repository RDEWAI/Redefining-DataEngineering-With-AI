skill: generate-config-template
version: "1.0"
cases:
  - id: TC-001
    name: "Config template generated from LLD Section 7"
    description: "Given an LLD with Configuration Schema, generates config-template.yaml"
    inputs:
      lld_path: "outputs/lld/v1/LLD-2026-03-22-patient-360.md"
    expected:
      - type: file_created
        description: "config-template.yaml created in outputs/lld/v1/config/"
      - type: yaml_valid
        description: "Generated YAML is valid"
    success_criteria: "Config template generated and valid YAML"

  - id: TC-002
    name: "All environments present in config"
    description: "Config template must have DEV, STAGING, and PROD sections"
    inputs:
      lld_path: "outputs/lld/v1/LLD-2026-03-22-patient-360.md"
    expected:
      - type: content_contains
        patterns: ["DEV", "STAGING", "PROD"]
    success_criteria: "All three environments represented in config"

  - id: TC-003
    name: "Missing Section 7 triggers error"
    description: "When LLD has no Configuration Schema section, generation should fail gracefully"
    inputs:
      lld_content: "LLD without Section 7"
    expected:
      - type: exit_code
        code: 1
    success_criteria: "Script exits with error when Section 7 is missing"
