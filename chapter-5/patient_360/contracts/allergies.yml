# Contract for synthea.allergies. Columns sourced from docs/ERD.mmd.
# updated: 2026-04-18

table: allergies
layer: bronze
schema: synthea
ddl_path: ddl/liquibase/changelogs/allergies.xml
dq_path: dq_rules/allergies.yml

owner: "Data Engineer"
description: "Patient allergies (safety-critical). Natural key: patient + encounter + start + code."
tags: [clinical, fact, safety_critical]

columns:
  - {name: start,        type: timestamp, nullable: true}
  - {name: stop,         type: timestamp, nullable: true}
  - {name: patient,      type: string,    nullable: false, description: "FK -> patients.id; required"}
  - {name: encounter,    type: string,    nullable: true,  description: "FK -> encounters.id"}
  - {name: code,         type: string,    nullable: false, description: "Allergy code; required"}
  - {name: system,       type: string,    nullable: true}
  - {name: description,  type: string,    nullable: true}
  - {name: type,         type: string,    nullable: true}
  - {name: category,     type: string,    nullable: true}
  - {name: reaction1,    type: string,    nullable: true}
  - {name: description1, type: string,    nullable: true}
  - {name: severity1,    type: string,    nullable: true}
  - {name: reaction2,    type: string,    nullable: true}
  - {name: description2, type: string,    nullable: true}
  - {name: severity2,    type: string,    nullable: true}
