- name: PAYER
  type: VARCHAR
  nullable: true
  source: synthea.encounters.PAYER
  description: FK to payers.Id
- name: ENCOUNTERCLASS
  type: VARCHAR
  nullable: true
  source: synthea.encounters.ENCOUNTERCLASS
