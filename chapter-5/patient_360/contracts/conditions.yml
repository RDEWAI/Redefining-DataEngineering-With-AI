# Contract for synthea.conditions. Columns sourced from docs/ERD.mmd.
# updated: 2026-04-18

table: conditions
layer: bronze
schema: synthea
ddl_path: ddl/liquibase/changelogs/conditions.xml
dq_path: dq_rules/conditions.yml

owner: "Data Engineer"
description: "Patient conditions / diagnoses. Natural key: patient + encounter + code + start."
tags: [clinical, fact]

columns:
  - {name: start,       type: timestamp, nullable: true}
  - {name: stop,        type: timestamp, nullable: true}
  - {name: patient,     type: string,    nullable: false, description: "FK -> patients.id; required"}
  - {name: encounter,   type: string,    nullable: true,  description: "FK -> encounters.id"}
  - {name: system,      type: string,    nullable: true}
  - {name: code,        type: string,    nullable: false, description: "Condition code; required"}
  - {name: description, type: string,    nullable: true}
