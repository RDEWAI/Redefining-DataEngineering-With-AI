# Contract for synthea.observations. Columns sourced from docs/ERD.mmd.
# updated: 2026-04-18

table: observations
layer: bronze
schema: synthea
ddl_path: ddl/liquibase/changelogs/observations.xml
dq_path: dq_rules/observations.yml

owner: "Data Engineer"
description: "Clinical observations / measurements."
tags: [clinical, fact]

columns:
  - {name: date,        type: date,   nullable: true}
  - {name: patient,     type: string, nullable: false, description: "FK -> patients.id; required"}
  - {name: encounter,   type: string, nullable: true,  description: "FK -> encounters.id"}
  - {name: category,    type: string, nullable: true}
  - {name: code,        type: string, nullable: true}
  - {name: description, type: string, nullable: true}
  - {name: value,       type: string, nullable: true}
  - {name: units,       type: string, nullable: true}
  - {name: type,        type: string, nullable: true}
