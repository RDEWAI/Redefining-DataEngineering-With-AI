# Bronze ingestion config — procedures
# Generated from LLD §5.1 (ingest_procedures). DQ: inline SE from
# dq_rules/procedures.yml. Empty-input: write_empty (default).
# updated: 2026-04-21

table: procedures
source:
  schema: synthea
  table: procedures
  format: csv
  path: data/raw/procedures.csv
schema_ref: contracts/procedures.yml
output_path: warehouse/{env}/bronze/synthea_procedures/
metadata_columns:
  - ds
  - _ingested_at
  - _source_batch_id
empty_input_behavior: write_empty
dq_rules_table: procedures
se_action_if_failed: drop
quarantine_path: warehouse/{env}/quarantine/bronze/procedures/
timeout_minutes: 30
retries: 3
retry_delay_seconds: 60
