# Bronze ingestion config — providers
# Generated from LLD §5.1 (ingest_providers). DQ: inline SE from
# dq_rules/providers.yml. Empty-input: fail — FK dimension.
# updated: 2026-04-21

table: providers
source:
  schema: synthea
  table: providers
  format: csv
  path: data/raw/providers.csv
schema_ref: contracts/providers.yml
output_path: warehouse/{env}/bronze/synthea_providers/
metadata_columns:
  - ds
  - _ingested_at
  - _source_batch_id
empty_input_behavior: fail
dq_rules_table: providers
se_action_if_failed: fail
quarantine_path: warehouse/{env}/quarantine/bronze/providers/
timeout_minutes: 30
retries: 3
retry_delay_seconds: 60
