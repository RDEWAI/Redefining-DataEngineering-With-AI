# Bronze ingestion config — payers
# Generated from LLD §5.1 (ingest_payers). DQ: inline SE from
# dq_rules/payers.yml. Empty-input: fail — FK dimension.
# updated: 2026-04-21

table: payers
source:
  schema: synthea
  table: payers
  format: csv
  path: data/raw/payers.csv
schema_ref: contracts/payers.yml
output_path: warehouse/{env}/bronze/synthea_payers/
metadata_columns:
  - ds
  - _ingested_at
  - _source_batch_id
empty_input_behavior: fail
dq_rules_table: payers
se_action_if_failed: fail
quarantine_path: warehouse/{env}/quarantine/bronze/payers/
timeout_minutes: 30
retries: 3
retry_delay_seconds: 60
