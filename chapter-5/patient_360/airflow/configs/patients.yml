# Bronze ingestion config -- ingest_patients
# Generated for STORY-02-003 (LLD §5.1, §4.2, §7.1).
# Filename stem `patients` drives the Airflow task id `ingest_patients`
# via the factory; the `table:` field below is the Bronze Delta table
# name (synthea_patients) used to look up contracts/<table>.yml and
# dq_rules/<table>.yml.
table: synthea_patients
layer: bronze
output_path: ${PATIENT360_WAREHOUSE_ROOT}/dev/bronze/synthea_patients/

source:
  type: csv
  path: data/raw_delta/patients.csv
  header: true

schema_ref: contracts/synthea_patients.yml
contracts_dir: contracts

output_table: unity.bronze.synthea_patients
catalog_bronze_catalog_name: unity
catalog_bronze_schema: bronze

metadata_columns:
  - ds
  - _ingested_at
  - _source_batch_id

empty_input_behavior: fail            # LLD §5.1 -- required for downstream
dq_rules_table: synthea_patients
dq_rules_dir: dq_rules
se_action_if_failed: fail             # LLD §5.4 fail-closed default
quarantine_path: warehouse/{env}/quarantine/bronze/synthea_patients/

timeout_minutes: 30                   # LLD §4.2
retries: 3
retry_delay_seconds: 60
