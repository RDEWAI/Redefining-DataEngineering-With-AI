# Bronze ingestion config — medications
# Generated from LLD §5.1 (ingest_medications). DQ: inline SE from
# dq_rules/medications.yml. Empty-input: write_empty (default).
# updated: 2026-04-21

table: medications
source:
  schema: synthea
  table: medications
  format: csv
  path: data/raw/medications.csv
schema_ref: contracts/medications.yml
output_path: warehouse/{env}/bronze/synthea_medications/
metadata_columns:
  - ds
  - _ingested_at
  - _source_batch_id
empty_input_behavior: write_empty
dq_rules_table: medications
se_action_if_failed: drop
quarantine_path: warehouse/{env}/quarantine/bronze/medications/
timeout_minutes: 30
retries: 3
retry_delay_seconds: 60
