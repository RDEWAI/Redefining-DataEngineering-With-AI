# Bronze ingestion config — encounters
# Generated from LLD §5.1 (ingest_encounters). DQ: inline SE from
# dq_rules/encounters.yml. Empty-input: fail — required for Gold.
# updated: 2026-04-21

table: encounters
source:
  schema: synthea
  table: encounters
  format: csv
  path: data/raw/encounters.csv
schema_ref: contracts/encounters.yml
output_path: warehouse/{env}/bronze/synthea_encounters/
metadata_columns:
  - ds
  - _ingested_at
  - _source_batch_id
empty_input_behavior: fail
dq_rules_table: encounters
se_action_if_failed: fail
quarantine_path: warehouse/{env}/quarantine/bronze/encounters/
timeout_minutes: 30
retries: 3
retry_delay_seconds: 60
