skill: validate-hld
version: "1.0"
cases:
  - id: TC-001
    name: "Valid HLD passes validation"
    description: "A complete, well-formed HLD passes with 0 CRITICAL issues"
    inputs:
      file: "test_fixtures/valid_hld.md"
    expected:
      - type: validation_pass
      - type: exit_code
        code: 0
    success_criteria: "Validator returns exit code 0, no CRITICAL issues"

  - id: TC-002
    name: "Missing sections caught as CRITICAL"
    description: "HLD missing required sections triggers CRITICAL findings"
    inputs:
      file: "test_fixtures/minimal_invalid_hld.md"
    expected:
      - type: validation_fail
        severity: CRITICAL
      - type: exit_code
        code: 1
    success_criteria: "Missing sections reported as CRITICAL, exit code 1"

  - id: TC-003
    name: "Empty sections caught as WARNING"
    description: "HLD with empty section bodies triggers WARNING findings"
    inputs:
      file: "test_fixtures/empty_sections_hld.md"
    expected:
      - type: validation_fail
        severity: WARNING
    success_criteria: "Empty sections reported as WARNING"

  - id: TC-004
    name: "Missing DRD traceability caught"
    description: "HLD without DRD section references triggers WARNING"
    inputs:
      file: "test_fixtures/no_traceability_hld.md"
    expected:
      - type: validation_fail
        severity: WARNING
    success_criteria: "Missing traceability reported as WARNING"
