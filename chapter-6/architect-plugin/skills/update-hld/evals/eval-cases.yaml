skill: update-hld
version: "1.0"
cases:
  - id: TC-001
    name: "Version incremented on update"
    description: "Updated HLD must have incremented version number"
    inputs:
      existing_artifact: "outputs/hld/v1/"
      changes: "Add new integration endpoint for lab results"
    expected:
      - type: content_contains
        patterns: ["Version"]
    success_criteria: "Version number incremented"

  - id: TC-002
    name: "Change log entry added"
    description: "Update adds a change log entry"
    inputs:
      existing_artifact: "outputs/hld/v1/"
      changes: "Revise technology decision from Kafka to Pulsar"
    expected:
      - type: content_contains
        patterns: ["change", "Pulsar"]
    success_criteria: "Change log captures the technology revision"

  - id: TC-003
    name: "Unchanged sections preserved"
    description: "Sections not affected by the update remain intact"
    inputs:
      existing_artifact: "outputs/hld/v1/"
      changes: "Update capacity model numbers"
    expected:
      - type: section_present
        sections: ["2. Architecture Overview", "7. Security & Governance"]
    success_criteria: "Unrelated sections unchanged"

  - id: TC-004
    name: "Updated HLD passes validation"
    description: "After update, the modified HLD still passes validation"
    inputs:
      existing_artifact: "outputs/hld/v1/"
      changes: "Minor clarification in architecture overview"
    expected:
      - type: validation_pass
    success_criteria: "Updated HLD passes validate-hld with 0 CRITICAL issues"
