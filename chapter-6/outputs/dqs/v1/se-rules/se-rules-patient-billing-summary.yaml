    priority: medium

  # --- Referential Integrity (query_dq) ---
  - rule: DQ-REF-020
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM analytics.patient_billing_summary b
            LEFT JOIN analytics.patient_summary s ON b.patient_id = s.patient_id
            WHERE s.patient_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Billing summary must have matching patient_summary -- Reject + Quarantine"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  # --- Reconciliation (query_dq) ---
  - rule: DQ-REC-009
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN ABS(s.total - t.total) * 100.0 / NULLIF(s.total, 0) <= 0.01
      THEN 1 ELSE 0 END
      FROM (SELECT SUM(BASE_ENCOUNTER_COST) AS total FROM synthea.encounters) s,
           (SELECT SUM(base_encounter_cost) AS total FROM analytics.patient_billing_summary) t
    action_if_failed: fail
    tag: reconciliation
    description: "Financial aggregate reconciliation -- base_encounter_cost SUM +/-0.01% [SLA SS3]"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

  # --- Freshness (query_dq) ---
  - rule: DQ-FRS-005
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - MAX(_ingested_at))) / 3600 <= 24
      THEN 1 ELSE 0 END
      FROM analytics.patient_billing_summary
    action_if_failed: ignore
    tag: freshness
    description: "BI Analytics SLA -- billing summary must be refreshed within 24 hours [DRD SS4.4]"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: medium
