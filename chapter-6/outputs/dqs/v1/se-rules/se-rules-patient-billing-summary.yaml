  # --- Statistical Distribution (agg_dq) ---
  - rule: DQ-STA-019
    rule_type: agg_dq
    column_name: ""
    expectation: "count(*) > 323505 and count(*) < 357559"
    action_if_failed: ignore
    tag: statistical_distribution
    description: "Row count within +/-5% of baseline (340,532)"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
