  # --- Referential Integrity (query_dq) ---
  - rule: DQ-REF-004
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_conditions c
            LEFT JOIN clinical.clinical_patients p ON c.patient_id = p.patient_id
            WHERE p.patient_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Conditions must have matching patient -- Reject + Quarantine"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high

