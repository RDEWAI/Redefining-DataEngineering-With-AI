    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_conditions c
            LEFT JOIN clinical.clinical_encounters e ON c.encounter_id = e.encounter_id
            WHERE e.encounter_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Conditions must have matching encounter -- Reject + Quarantine"
