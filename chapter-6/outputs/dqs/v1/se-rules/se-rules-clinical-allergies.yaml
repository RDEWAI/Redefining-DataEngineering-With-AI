  # --- Statistical Distribution (agg_dq) ---
  - rule: DQ-STA-016
    rule_type: agg_dq
    column_name: ""
    expectation: "count(*) > 5495 and count(*) < 5719"
    action_if_failed: fail
    tag: statistical_distribution
    description: "Row count within +/-2% of baseline (5,607) -- patient-critical (allergy safety)"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: high

  - rule: DQ-STA-023
    rule_type: agg_dq
    column_name: ""
    expectation: "count(CASE WHEN severity1 IS NULL THEN 1 END) * 100.0 / count(*) > 50 and count(CASE WHEN severity1 IS NULL THEN 1 END) * 100.0 / count(*) < 70"
    action_if_failed: ignore
    tag: statistical_distribution
    description: "severity1 null rate baseline 56.4% -- WARNING if >62%, CRITICAL if >70%"
    enable_for_source_dq_validation: false
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5
    query_dq_delimiter: "@"
    enable_querydq_custom_output: false
    priority: medium

  # --- Referential Integrity (query_dq) ---
  - rule: DQ-REF-010
    rule_type: query_dq
    column_name: ""
    expectation: >
      CASE WHEN orphan_count = 0
      THEN 1 ELSE 0 END
      FROM (SELECT COUNT(*) AS orphan_count FROM clinical.clinical_allergies a
            LEFT JOIN clinical.clinical_patients p ON a.patient_id = p.patient_id
            WHERE p.patient_id IS NULL) t
    action_if_failed: fail
    tag: referential_integrity
    description: "Allergies must have matching patient -- Reject + Quarantine"
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    query_dq_delimiter: "@"
    enable_querydq_custom_output: true
    priority: high
