skill: update-dqs
version: "1.0"
cases:
  - id: TC-001
    name: "Version incremented on update"
    description: "Updated DQS must have incremented version number"
    inputs:
      existing_artifact: "outputs/dqs/v1/"
      changes: "Add new referential integrity check for lab_results"
    expected:
      - type: content_contains
        patterns: ["Version"]
    success_criteria: "Version number incremented"

  - id: TC-002
    name: "New rules get proper IDs"
    description: "Added rules must follow the DQ-{layer}-{table}-{NNN} convention"
    inputs:
      existing_artifact: "outputs/dqs/v1/"
      changes: "Add field validation for new provider_npi column"
    expected:
      - type: content_contains
        patterns: ["DQ-"]
    success_criteria: "New rules have correctly formatted IDs"

  - id: TC-003
    name: "Unchanged sections preserved"
    description: "Sections not affected by the update remain intact"
    inputs:
      existing_artifact: "outputs/dqs/v1/"
      changes: "Update alert thresholds for freshness checks"
    expected:
      - type: section_present
        sections: ["1. Field-Level Validation Rules", "2. Referential Integrity Checks"]
    success_criteria: "Unrelated sections unchanged"

  - id: TC-004
    name: "Updated DQS passes validation"
    description: "After update, the modified DQS still passes validation"
    inputs:
      existing_artifact: "outputs/dqs/v1/"
      changes: "Minor rule description clarification"
    expected:
      - type: validation_pass
    success_criteria: "Updated DQS passes validate-dqs with 0 CRITICAL issues"
