product_id: patient-360
dq_env:
  DEV:
    table_name: unity.bronze.synthea_payers
    action_if_failed: ignore
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: false
    error_drop_threshold: 0
    priority: medium
  QA:
    table_name: unity.bronze.synthea_payers
    action_if_failed: ignore
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 5
    priority: medium
  PROD:
    table_name: unity.bronze.synthea_payers
    action_if_failed: fail
    enable_for_source_dq_validation: true
    enable_for_target_dq_validation: true
    is_active: true
    enable_error_drop_alert: true
    error_drop_threshold: 2
    priority: high
rules:
- rule: DQ_FLD_045
  rule_type: row_dq
  column_name: Id
  expectation: Id IS NOT NULL
  action_if_failed: ignore
  tag: field_validation
  description: NOT NULL on Id
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: high
- rule: DQ_STA_013
  rule_type: agg_dq
  column_name: ''
  expectation: count(*) > 9 and count(*) < 10
  action_if_failed: ignore
  tag: statistical_distribution
  description: 'Statistical check: Row Count baseline=10'
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: true
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: medium
- rule: DQ_REC_013
  rule_type: query_dq
  column_name: ''
  expectation: CASE WHEN ABS(s.cnt - t.cnt) * 100.0 / NULLIF(s.cnt, 0) <= 0 THEN 1 ELSE 0 END FROM (SELECT COUNT(*) AS cnt FROM synthea.payers) s, (SELECT COUNT(*) AS cnt FROM unity.bronze.synthea_payers) t
  action_if_failed: fail
  tag: reconciliation
  description: 'Reconciliation: synthea.payers vs unity.bronze.synthea_payers (COUNT(*)), tolerance=0% (exact match)'
  enable_for_source_dq_validation: true
  enable_for_target_dq_validation: true
  is_active: false
  enable_error_drop_alert: true
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: true
  priority: high
