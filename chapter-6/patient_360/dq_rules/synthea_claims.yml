  rule_type: query_dq
  column_name: ''
  expectation: CASE WHEN ABS(s.cnt - t.cnt) * 100.0 / NULLIF(s.cnt, 0) <= 0 THEN 1 ELSE 0 END FROM (SELECT COUNT(*) AS cnt FROM synthea.claims) s, (SELECT COUNT(*) AS cnt FROM bronze.synthea_claims) t
  action_if_failed: fail
  tag: reconciliation
  description: 'Reconciliation: synthea.claims vs bronze.synthea_claims (COUNT(*)), tolerance=0% (exact match)'
  enable_for_source_dq_validation: true
  enable_for_target_dq_validation: true
  is_active: false
  enable_error_drop_alert: true
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: true
  priority: high
