rules:
- rule: DQ_FLD_095
  rule_type: row_dq
  column_name: organization_id
  expectation: organization_id IS NOT NULL
  action_if_failed: fail
  tag: field_validation
  description: NOT NULL on organization_id
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: high
- rule: DQ_FLD_096
  rule_type: row_dq
  column_name: is_current
  expectation: is_current IS NOT NULL
  action_if_failed: fail
  tag: field_validation
  description: NOT NULL on is_current
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: false
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: high
- rule: DQ_FLD_184
  rule_type: row_dq
  column_name: is_current
  expectation: COUNT(*) FILTER (WHERE is_current = TRUE) = COUNT(DISTINCT organization_id)
  action_if_failed: ignore
  tag: field_validation
  description: CONSISTENCY on is_current
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: false
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: false
  priority: medium
