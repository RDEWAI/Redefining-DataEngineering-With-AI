- rule: DQ_REF_010
  rule_type: query_dq
  column_name: ''
  expectation: (SELECT COUNT(*) FROM clinical_allergies_view c LEFT JOIN clinical_patients p ON c.patient_id = p.patient_id WHERE p.patient_id IS NULL) = 0
  action_if_failed: ignore
  tag: referential_integrity
  description: 'FK check: clinical_allergies.patient_id -> clinical_patients.patient_id'
  enable_for_source_dq_validation: false
  enable_for_target_dq_validation: true
  is_active: true
  enable_error_drop_alert: false
  error_drop_threshold: 2
  query_dq_delimiter: '@'
  enable_querydq_custom_output: true
  priority: high
- rule: DQ_STA_016
  rule_type: agg_dq
  column_name: ''
  expectation: count(*) > 5494 and count(*) < 5719
  action_if_failed: ignore
  tag: statistical_distribution
  description: 'Statistical check: Row Count baseline=5,607'
