# Bronze ingestion config -- ingest_careplans
# Generated for STORY-02-003 (LLD §5.1, §4.2, §7.1).
# Filename stem `careplans` drives the Airflow task id `ingest_careplans`
# via the factory; the `table:` field below is the Bronze Delta table
# name (synthea_careplans) used to look up contracts/<table>.yml and
# dq_rules/<table>.yml.
table: synthea_careplans
layer: bronze
output_path: ${PATIENT360_WAREHOUSE_ROOT}/dev/bronze/synthea_careplans/

source:
  type: csv
  path: data/raw_delta/careplans.csv
  header: true

schema_ref: contracts/synthea_careplans.yml
contracts_dir: contracts

output_table: unity.bronze.synthea_careplans
catalog_bronze_catalog_name: unity
catalog_bronze_schema: bronze

metadata_columns:
  - ds
  - _ingested_at
  - _source_batch_id

empty_input_behavior: write_empty            # LLD §5.1 default
dq_rules_table: synthea_careplans
dq_rules_dir: dq_rules
se_action_if_failed: drop             # LLD §5.4 fail-closed default
quarantine_path: warehouse/{env}/quarantine/bronze/synthea_careplans/

timeout_minutes: 30                   # LLD §4.2
retries: 3
retry_delay_seconds: 60
