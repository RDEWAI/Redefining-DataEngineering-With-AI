[project]
name = "patient_360"
version = "0.1.0"
description = "chapter-5 — Patient 360 medallion pipeline"
authors = [{ name = "Data Engineer" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyspark[sql]>=4.0",
    "delta-spark>=4.0",
    "spark-expectations>=2.10.0",
    # httpx is used by scripts/bootstrap_uc_tables.py to POST to the UC OSS
    # REST API (LLD v1.18 §13 Decision 17). Falls back to stdlib
    # urllib.request if httpx is unavailable, so the dep is technically
    # optional -- but pinning it here gives a consistent client across
    # all envs.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "apache-airflow>=2.9.0",
    "apache-airflow-providers-apache-spark>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_360"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring Spark/UC/Docker (run via `make integration-test`)",
    "benchmark: performance benchmark tests (LLD §6 perf tuning; opt-in via `pytest -m benchmark`)",
]
