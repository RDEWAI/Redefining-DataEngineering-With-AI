## UC OSS server config — patient_360 dev stack.
##
## Default is "experimental" / disabled, so saveAsTable without an
## explicit ``path`` raises:
##   MANAGED table is an experimental feature and is currently disabled.
##
## Enabling it lets UC own the storage path for Bronze/Silver/Gold tables
## via ``spark.sql.warehouse.dir``, matching the MVP pattern. EXTERNAL
## tables would require a UC storage-credential (cloud only) which UC
## OSS 0.4.0 cannot satisfy for local filesystems.
server.managed-table.enabled=true
