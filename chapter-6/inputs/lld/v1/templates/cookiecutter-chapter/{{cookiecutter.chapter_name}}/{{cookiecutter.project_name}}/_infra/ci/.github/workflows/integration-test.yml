{%- raw -%}
name: integration-test
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: uv sync --all-extras
      - name: Bring up stack
        run: make dev-up
      - name: Integration tests
        run: make integration-test
      - name: Tear down stack
        if: always()
        run: make dev-down
{%- endraw -%}
