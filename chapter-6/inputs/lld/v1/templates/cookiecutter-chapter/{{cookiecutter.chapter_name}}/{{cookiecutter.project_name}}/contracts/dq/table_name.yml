# DQ contract pointer — links this table's contract to its DQ rules file.
# This file is the entry point; the actual rules live in dq_rules/.

table: table_name
dq_rules_path: ../../dq_rules/table_name.yml

# Severity thresholds for this table.
thresholds:
  completeness_min: 0.99    # >= 99% of critical fields must be non-null
  validity_min: 0.995       # >= 99.5% of rows must pass validity checks
  freshness_max_hours: 25   # data must not be older than 25 hours
