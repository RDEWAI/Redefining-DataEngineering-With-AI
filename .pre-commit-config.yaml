# Pre-commit hooks configuration for Chapter 2, Chapter 3, Chapter 4, and Chapter 5
# Install: uv run pre-commit install && uv run pre-commit install --hook-type pre-push
# Run manually: uv run pre-commit run --all-files
#
# Note: Hooks are scoped to chapter-2/, chapter-3/, chapter-4/, and chapter-5/ directories

repos:
  # Ruff - fast Python linter and formatter (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Ruff linting (check for errors, style issues)
      - id: ruff
        name: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        files: ^(chapter-2|chapter-3|chapter-4|chapter-5)/
        exclude: ^chapter-\d+/(inputs|outputs)/.*/templates/

      # Ruff formatting (check code format, don't auto-fix in pre-commit)
      - id: ruff-format
        name: ruff-format
        args: [--check]
        types_or: [python, pyi]
        files: ^(chapter-2|chapter-3|chapter-4|chapter-5)/
        exclude: ^chapter-\d+/(inputs|outputs)/.*/templates/

  # Mypy - static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy
        args: [--config-file=chapter-2/pyproject.toml]
        additional_dependencies:
          - types-requests
          - pandas-stubs
        types: [python]
        # Only run mypy on chapter-2/src/ to avoid test file issues
        files: ^chapter-2/src/
        pass_filenames: false
        entry: mypy chapter-2/src/

  # Project-agnostic guard: developer-plugin code/tests must never hardcode
  # the example use case (patient_360 / synthea). SKILL.md prose examples
  # are allowed; everything else (Python, YAML, hooks) is not. Per
  # chapter-5/CLAUDE.md "Developer plugin": the plugin reads upstream
  # artifacts at runtime — project_name and schema are discovered, not baked in.
  - repo: local
    hooks:
      - id: developer-plugin-project-agnostic
        name: developer-plugin-project-agnostic
        entry: |-
          bash -c '
            hits=$(grep -RnE "patient_360|synthea" chapter-5/developer-plugin --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" 2>/dev/null)
            if [ -n "$hits" ]; then
              printf "ERROR developer-plugin must stay project-agnostic. Replace with project/prefix placeholders.\n%s\n" "$hits"
              exit 1
            fi
          '
        language: system
        pass_filenames: false
        files: ^chapter-5/developer-plugin/

  # Unit tests on pre-push (runs before code is pushed to remote)
  - repo: local
    hooks:
      - id: pytest-unit-ch2
        name: pytest-unit-ch2
        entry: bash -c 'cd chapter-2 && uv run pytest tests/unit/ -v --tb=short'
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^chapter-2/

      - id: pytest-unit-ch3
        name: pytest-unit-ch3
        entry: bash -c 'cd chapter-3 && uv run pytest tests/ -v --tb=short'
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^chapter-3/

      - id: pytest-unit-ch4
        name: pytest-unit-ch4
        entry: bash -c 'cd chapter-4 && uv run pytest tests/ -v --tb=short'
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^chapter-4/

      - id: pytest-unit-ch5
        name: pytest-unit-ch5
        entry: bash -c 'cd chapter-5 && uv run pytest tests/ -v --tb=short'
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^chapter-5/
